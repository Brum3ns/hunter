services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - hunter_db:/var/lib/postgresql
    ports:
      - "0.0.0.0:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs the vulnerability module (and future modules). Rails connects via the
  # MONGO_* env below.
  #
  # Runs as a single-node replica set (rs0) — parity with production, and a
  # replica set is required for MongoDB change streams, which drive the
  # Mongo->Postgres sitemap sync. The healthcheck initiates the set on first
  # boot (idempotent — a re-init throws and is swallowed) and only reports
  # healthy once a primary is elected, so dependents wait for a writable node.
  # The member advertises host `mongo:27017`, reachable on the compose network;
  # host-side tools (Compass/mongosh from the host) should connect with
  # `?directConnection=true` since `mongo` won't resolve outside the network.
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    ports:
      - "0.0.0.0:27017:27017"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "if (!db.hello().isWritablePrimary) { try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } catch (e) {} ; throw new Error('mongo rs0 not ready') }"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 5s

  # One-shot: generates the machine credentials every assistant service reads
  # (the four AMQP passwords and the gateway MCP token). Deliberately needs no
  # database and no other service, so it runs first and unblocks `rabbitmq`
  # without the broker inheriting a dependency on the Rails app. The
  # database-backed half of bootstrapping is assistant-token-init, below `web`.
  assistant-secrets-init:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RAILS_ENV: development
        BUNDLE_WITHOUT: ""
    command: ["/app/ops/assistant/bootstrap.sh"]
    environment:
      HOME: /tmp
      ASSISTANT_SECRET_TARGET: /run/assistant/secrets
    volumes:
      - assistant_secrets:/run/assistant/secrets
    networks:
      - default
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 64
    restart: "no"

  # Local broker so Control Center job submissions land on a visible channel.
  # Management UI at http://localhost:15672 (same credentials as below).
  rabbitmq:
    build:
      context: ./ops/assistant/rabbitmq
      dockerfile: Dockerfile
    # Provision the broker user the web service authenticates as. These apply only
    # on first boot of an empty data dir, so the named volume below must be fresh
    # (or reset) for a credential change to take effect. The created user is a
    # full administrator, which also satisfies whiterabbit's -info management API.
    environment:
      ASSISTANT_RABBITMQ_REPROVISION: ${ASSISTANT_RABBITMQ_REPROVISION:-false}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-hunter}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hunter}
      RABBITMQ_PROVISION_PASSWORD_FILE: /run/assistant/secrets/assistant_rabbitmq_provision_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - assistant_secrets:/run/assistant/secrets:ro
    networks:
      - default
      - assistant-queue
      - assistant-gateway-queue
      - assistant-validator-queue
    ports:
      - "0.0.0.0:5673:5672"
      - "0.0.0.0:15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && test -f /tmp/hunter-assistant-rabbitmq-ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    # rabbitmq's entrypoint hard-fails (exit 1, no retry) when the provision
    # password file is absent, and that file is now generated at runtime rather
    # than pre-existing as a Compose file secret. Gating on assistant-secrets-init
    # — which needs no database — means the broker waits only for the credential
    # it reads, never for the Rails app.
    depends_on:
      assistant-secrets-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RAILS_ENV: development
        BUNDLE_WITHOUT: ""
    # Load .env into the container. Without this, compose only uses .env for
    # ${VAR} substitution at parse time; env_file makes compose error loudly if
    # .env is missing or malformed.
    env_file:
      - .env
    # Single-quoted outer so the Ruby one-liner can use double quotes freely.
    # db:prepare loads the primary schema.rb, which intentionally omits the
    # Solid Queue tables (production keeps them in a dedicated `queue` database).
    # Dev is single-DB, so load db/queue_schema.rb into hunter_development before
    # foreman starts the `worker` (bin/rails solid_queue:start) — otherwise the
    # worker crashes on the missing solid_queue_processes table and takes the
    # whole web service down with it. Guarded so it only runs on a fresh DB.
    command: >
      sh -c 'rm -f tmp/pids/server.pid &&
             bundle install &&
             bundle exec rails db:prepare &&
             bundle exec rails runner "ActiveRecord::Base.connection.table_exists?(%q(solid_queue_processes)) || load(Rails.root.join(%q(db/queue_schema.rb)))" &&
             bundle exec rails db:seed &&
             foreman start -f Procfile.dev'
    environment:
      RAILS_ENV: development
      # Allow the runner (and any other in-network service) to reach this app by
      # its compose hostname. Rails' development Host Authorization only permits
      # *.localhost/*.test and literal IPs by default, so requests arriving with
      # `Host: web:5000` are otherwise blocked with 403 before hitting a
      # controller. Rails appends this (comma-separated) to config.hosts at boot.
      RAILS_DEVELOPMENT_HOSTS: ${RAILS_DEVELOPMENT_HOSTS:-web}
      # PostgreSQL connection — every setting overridable from .env.
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-hunter_development}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-dev-primary-key-32-bytes-only-01}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-dev-deterministic-key-32-byte-01}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-dev-key-derivation-salt-32-byte01}
      # MongoDB connection — every setting overridable from .env.
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      # Replica-set name — makes the Ruby driver replica-set aware (required for
      # change streams). Matches the set the mongo service initiates above.
      MONGO_REPLICA_SET: ${MONGO_REPLICA_SET:-rs0}
      # Sitemap sources: `alive` = probed assets (targets); `crawl` = all crawled
      # endpoints (see tmp/db_struct/crawl.json). Override to point at your names.
      MONGO_ALIVE_COLLECTION: ${MONGO_ALIVE_COLLECTION:-alive}
      MONGO_CRAWL_COLLECTION: ${MONGO_CRAWL_COLLECTION:-crawl}
      MONGO_DATABASE: ${MONGO_DATABASE:-bugbounty}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-vulnerabilities}
      # Programs module reads its own collection (the Scope CLI writes to "scope").
      MONGO_PROGRAMS_COLLECTION: ${MONGO_PROGRAMS_COLLECTION:-scope}
      MONGO_USERNAME: ${MONGO_USERNAME:-}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
      MONGO_SERVER_SELECTION_TIMEOUT: ${MONGO_SERVER_SELECTION_TIMEOUT:-3}
      MONGO_CONNECT_TIMEOUT: ${MONGO_CONNECT_TIMEOUT:-3}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Control Center — Whiterabbit standalone sender.
      WHITERABBIT_BIN: ${WHITERABBIT_BIN:-/usr/local/bin/whiterabbit}
      CMDSCRIPT_HASH_SALT: ${CMDSCRIPT_HASH_SALT:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_HTTP_PORT: ${RABBITMQ_HTTP_PORT:-15672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-hunter}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-hunter}
      RABBITMQ_TOKEN: ${RABBITMQ_TOKEN:-}
      CONTROL_CENTER_COMMAND_ALLOWLIST: ${CONTROL_CENTER_COMMAND_ALLOWLIST:-}
      ANSIBLE_LEASE_SECONDS: ${ANSIBLE_LEASE_SECONDS:-45}
      ANSIBLE_CLAIM_TIMEOUT_SECONDS: ${ANSIBLE_CLAIM_TIMEOUT_SECONDS:-300}
      ASSISTANT_AMQP_HOST: ${ASSISTANT_AMQP_HOST:-rabbitmq}
      ASSISTANT_AMQP_PORT: ${ASSISTANT_AMQP_PORT:-5672}
      ASSISTANT_AMQP_PASSWORD_FILE: /run/assistant/secrets/assistant_rails_amqp_password
      ASSISTANT_ANSIBLE_MODULE_ALLOWLIST: ${ASSISTANT_ANSIBLE_MODULE_ALLOWLIST:-}
      ASSISTANT_TRANSCRIPT_DAYS: "7"
      ASSISTANT_AUDIT_DAYS: "90"
      ASSISTANT_GRANT_TTL_SECONDS: "300"
      ASSISTANT_MAX_RECORDS: "10"
      ASSISTANT_MAX_TOOL_CALLS: "8"
      ASSISTANT_MAX_RESULT_BYTES: "65536"
      ASSISTANT_MAX_TOTAL_BYTES: "262144"
      ASSISTANT_TURN_STARTS_PER_MINUTE: "10"
      ASSISTANT_TURN_STARTS_PER_HOUR: "60"
      ASSISTANT_MAX_CONCURRENT_TURNS: "2"
      ASSISTANT_MAX_VALIDATIONS_PER_TURN: "1"
    volumes:
      # Mount source for live reload — code edits hot-reload in the container.
      - ./web:/app
      - assistant_secrets:/run/assistant/secrets:ro
    networks:
      - default
      - assistant-queue
      - assistant-mcp-rails
    ports:
      - "0.0.0.0:5000:5000"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Gates assistant-token-init: Puma only binds :5000 after db:prepare/db:seed
    # finish (see the command above), so a successful /up probe is proof the
    # schema the token bootstrap writes to already exists.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/up"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 90s
    tty: true
    stdin_open: true

  # One-shot: mints the hunter-mcp service identity in Postgres and writes its
  # token to the shared volume. Split from assistant-secrets-init because this
  # half needs a migrated database, so it must wait for `web` to be healthy —
  # a dependency the broker must not inherit. Only hunter-mcp reads its output.
  assistant-token-init:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RAILS_ENV: development
        BUNDLE_WITHOUT: ""
    command: ["bundle", "exec", "ruby", "/app/ops/assistant/bootstrap_service_token.rb"]
    environment:
      HOME: /tmp
      RAILS_ENV: development
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-hunter_development}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-dev-primary-key-32-bytes-only-01}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-dev-deterministic-key-32-byte-01}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-dev-key-derivation-salt-32-byte01}
      ASSISTANT_MCP_TOKEN_PATH: /run/assistant/secrets/assistant_mcp_hunter_token
    volumes:
      - assistant_secrets:/run/assistant/secrets
    networks:
      - default
    depends_on:
      web:
        condition: service_healthy
    user: "1000:1000"
    read_only: true
    # Booting Rails read-only needs the same writable paths assistant-events
    # carries: Bootsnap caches under tmp/cache and the logger opens log/*.log,
    # and both directories are .dockerignore'd so neither exists in the image.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=0700,uid=1000,gid=1000
      - /app/tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=1000,gid=1000
      - /app/log:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
      - /app/storage:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    mem_limit: 384m
    cpus: "0.50"
    pids_limit: 64
    restart: "no"

  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    env_file: [.env]
    environment:
      HUNTER_API_URL: http://web:5000
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      RUNNER_POLL_INTERVAL: ${RUNNER_POLL_INTERVAL:-2}
      # How many curl jobs this runner executes at once. Each job is a blocking
      # curl + result POST, so the pool overlaps them instead of queueing behind
      # one slow request.
      RUNNER_MAX_CONCURRENCY: ${RUNNER_MAX_CONCURRENCY:-30}
      CURL_MAX_TIME: ${CURL_MAX_TIME:-30}
      CURL_MAX_OUTPUT: ${CURL_MAX_OUTPUT:-262144}
    depends_on:
      web:
        condition: service_started
    user: "65534:65534"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Sized for the default 30-way pool: each worker is a thread and each curl a
    # subprocess (both count toward the process limit below), and up to 30
    # responses buffer in memory at once. Raise these together with
    # RUNNER_MAX_CONCURRENCY.
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

  # Pull-based Ansible execution is opt-in in development because its token is
  # minted in Settings and must carry the dedicated `ansible` capability.
  ansible-executor:
    profiles: ["ansible"]
    build:
      context: .
      dockerfile: ansible_executor/Dockerfile
    environment:
      HUNTER_URL: ${HUNTER_ANSIBLE_URL:-http://web:5000}
      HUNTER_RUNNER_TOKEN: ${HUNTER_ANSIBLE_RUNNER_TOKEN:-}
      ANSIBLE_ALLOWED_CIDRS: ${ANSIBLE_ALLOWED_CIDRS:-}
      ANSIBLE_ALLOWED_PORTS: ${ANSIBLE_ALLOWED_PORTS:-22}
      ANSIBLE_POLL_SECONDS: ${ANSIBLE_POLL_SECONDS:-2}
      ANSIBLE_HEARTBEAT_SECONDS: ${ANSIBLE_HEARTBEAT_SECONDS:-15}
      ANSIBLE_LEASE_SECONDS: ${ANSIBLE_LEASE_SECONDS:-45}
      ANSIBLE_MAX_EVENT_BATCH: ${ANSIBLE_MAX_EVENT_BATCH:-100}
      ANSIBLE_MAX_BUFFER_BYTES: ${ANSIBLE_MAX_BUFFER_BYTES:-5242880}
      ANSIBLE_CANCEL_GRACE_SECONDS: ${ANSIBLE_CANCEL_GRACE_SECONDS:-10}
      ANSIBLE_MAX_FORKS: ${ANSIBLE_MAX_FORKS:-5}
      ANSIBLE_WORKSPACE_ROOT: /runner
    depends_on:
      web:
        condition: service_started
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /runner:rw,noexec,nosuid,nodev,mode=0700,size=64m
    mem_limit: 512m
    pids_limit: 256
    init: true
    restart: unless-stopped

  assistant-rabbitmq-init:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RAILS_ENV: development
        BUNDLE_WITHOUT: ""
    command: ["bundle", "exec", "ruby", "/app/ops/assistant/provision_rabbitmq.rb"]
    environment:
      HOME: /tmp
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_PROVISION_USERNAME: assistant-provisioner
      RABBITMQ_PROVISION_PASSWORD_FILE: /run/assistant/secrets/assistant_rabbitmq_provision_password
      ASSISTANT_RAILS_AMQP_PASSWORD_FILE: /run/assistant/secrets/assistant_rails_amqp_password
      ASSISTANT_GATEWAY_AMQP_PASSWORD_FILE: /run/assistant/secrets/assistant_gateway_amqp_password
      ASSISTANT_VALIDATOR_AMQP_PASSWORD_FILE: /run/assistant/secrets/assistant_validator_amqp_password
    volumes:
      - assistant_secrets:/run/assistant/secrets:ro
    networks:
      - assistant-queue
    depends_on:
      rabbitmq:
        condition: service_healthy
      assistant-secrets-init:
        condition: service_completed_successfully
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 64
    restart: "on-failure:3"

  assistant-events:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RAILS_ENV: development
        BUNDLE_WITHOUT: ""
    command: ["bin/rails", "runner", "Assistant::EventConsumer.run"]
    env_file:
      - .env
    environment:
      HOME: /tmp
      RAILS_ENV: development
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-hunter_development}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-dev-primary-key-32-bytes-only-01}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-dev-deterministic-key-32-byte-01}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-dev-key-derivation-salt-32-byte01}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      CONTROL_CENTER_COMMAND_ALLOWLIST: ${CONTROL_CENTER_COMMAND_ALLOWLIST:-}
      ASSISTANT_AMQP_HOST: ${ASSISTANT_AMQP_HOST:-rabbitmq}
      ASSISTANT_AMQP_PORT: ${ASSISTANT_AMQP_PORT:-5672}
      ASSISTANT_AMQP_PASSWORD_FILE: /run/assistant/secrets/assistant_rails_amqp_password
      ASSISTANT_ANSIBLE_MODULE_ALLOWLIST: ${ASSISTANT_ANSIBLE_MODULE_ALLOWLIST:-}
      ASSISTANT_TRANSCRIPT_DAYS: "7"
      ASSISTANT_AUDIT_DAYS: "90"
    volumes:
      - assistant_secrets:/run/assistant/secrets:ro
    networks:
      - default
      - assistant-queue
      - assistant-mcp-rails
    depends_on:
      web:
        condition: service_started
      assistant-rabbitmq-init:
        condition: service_completed_successfully
      assistant-secrets-init:
        condition: service_completed_successfully
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /app/tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=1000,gid=1000
      - /app/log:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
      - /app/storage:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    mem_limit: 384m
    cpus: "0.50"
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  assistant-egress:
    build:
      context: ./assistant/egress
      dockerfile: Dockerfile
    networks:
      - assistant-egress-in
      - assistant-egress-out
    user: "31:31"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=31,gid=31
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/assistant/seccomp/egress.json
      - apparmor=hunter-assistant-egress
    init: true
    mem_limit: 128m
    cpus: "0.50"
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/usr/sbin/squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  hunter-mcp:
    build:
      context: ./assistant/mcp
      dockerfile: Dockerfile
    environment:
      ASSISTANT_HUNTER_URL: http://web:5000
      ASSISTANT_HUNTER_ALLOWED_HOSTS: web:5000
      ASSISTANT_MCP_ALLOWED_HOSTS: hunter-mcp:8080
      ASSISTANT_MCP_ALLOWED_ORIGINS: http://assistant-gateway:8081
    volumes:
      - assistant_secrets:/run/assistant/secrets:ro
    networks:
      - assistant-gateway-mcp
      - assistant-mcp-rails
    # Reads the gateway MCP token from assistant-secrets-init and its own Hunter
    # service token from assistant-token-init, so it waits for both.
    depends_on:
      web:
        condition: service_started
      assistant-secrets-init:
        condition: service_completed_successfully
      assistant-token-init:
        condition: service_completed_successfully
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/assistant/seccomp/mcp.json
      - apparmor=hunter-mcp
    init: true
    mem_limit: 128m
    cpus: "0.50"
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/hunter-mcp", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  assistant-validator:
    build:
      context: ./assistant/validator
      dockerfile: Dockerfile
    volumes:
      - assistant_secrets:/run/assistant/secrets:ro
    networks:
      - assistant-validator-queue
    depends_on:
      assistant-rabbitmq-init:
        condition: service_completed_successfully
      assistant-secrets-init:
        condition: service_completed_successfully
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=1000,gid=1000
      - /work:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/assistant/seccomp/validator.json
      - apparmor=hunter-assistant-validator
    init: true
    mem_limit: 256m
    cpus: "1.00"
    pids_limit: 96
    healthcheck:
      test: ["CMD", "/hunter-assistant-validator", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  assistant-gateway:
    build:
      context: ./assistant/gateway
      dockerfile: Dockerfile
    volumes:
      - ./secrets:/run/secrets:ro
      - assistant_secrets:/run/assistant/secrets:ro
    networks:
      - assistant-gateway-queue
      - assistant-gateway-mcp
      - assistant-egress-in
    depends_on:
      assistant-rabbitmq-init:
        condition: service_completed_successfully
      hunter-mcp:
        condition: service_healthy
      assistant-egress:
        condition: service_healthy
      assistant-secrets-init:
        condition: service_completed_successfully
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/assistant/seccomp/gateway.json
      - apparmor=hunter-assistant-gateway
    init: true
    mem_limit: 256m
    cpus: "1.00"
    pids_limit: 96
    healthcheck:
      test: ["CMD", "/hunter-assistant-gateway", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  hunter_db:
  mongodb_data:
  rabbitmq_data:
  # Bootstrap-generated machine credentials (RabbitMQ/MCP). The two init
  # one-shots are the only read-write mounts; every consumer mounts it :ro.
  #
  # UPGRADING FROM AN EARLIER BUILD: Docker seeds a named volume from the image
  # only while the volume is still empty, so a volume created before the image
  # gained /run/assistant/secrets is owned root:root and assistant-secrets-init
  # (uid 1000) cannot write it. Because rabbitmq — and therefore web — waits on
  # that one-shot, the whole stack stays down, not just the assistant. Remove
  # the stale volume once before the first `up` on the new images:
  #     docker compose down && docker volume rm <project>_assistant_secrets
  # Nothing is lost: every file in it is regenerated on the next boot.
  assistant_secrets:

networks:
  assistant-queue:
    internal: true
  assistant-gateway-queue:
    internal: true
  assistant-gateway-mcp:
    internal: true
  assistant-mcp-rails:
    internal: true
  assistant-validator-queue:
    internal: true
  assistant-egress-in:
    internal: true
  assistant-egress-out: {}
