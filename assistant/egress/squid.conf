visible_hostname hunter-assistant-egress
http_port 3128

acl all src all
acl manager proto cache_object
acl CONNECT method CONNECT
acl TLS_port port 443
acl provider_domains dstdomain api.openai.com api.anthropic.com

# Resolve and deny non-public destinations before considering the hostname
# allowlist. This makes provider DNS resolving to a local or metadata address a
# denial, not a bypass.
acl forbidden_destinations dst 0.0.0.0/8
acl forbidden_destinations dst 10.0.0.0/8
acl forbidden_destinations dst 100.64.0.0/10
acl forbidden_destinations dst 127.0.0.0/8
acl forbidden_destinations dst 169.254.0.0/16
acl forbidden_destinations dst 172.16.0.0/12
acl forbidden_destinations dst 192.0.0.0/24
acl forbidden_destinations dst 192.0.2.0/24
acl forbidden_destinations dst 192.168.0.0/16
acl forbidden_destinations dst 198.18.0.0/15
acl forbidden_destinations dst 198.51.100.0/24
acl forbidden_destinations dst 203.0.113.0/24
acl forbidden_destinations dst 224.0.0.0/4
acl forbidden_destinations dst 240.0.0.0/4
acl forbidden_destinations dst ::/128
acl forbidden_destinations dst ::1/128
acl forbidden_destinations dst 64:ff9b::/96
acl forbidden_destinations dst 100::/64
acl forbidden_destinations dst 2001:db8::/32
acl forbidden_destinations dst fc00::/7
acl forbidden_destinations dst fe80::/10
acl forbidden_destinations dst ff00::/8

http_access deny manager
http_access deny !CONNECT
http_access deny !TLS_port
http_access deny forbidden_destinations
http_access allow provider_domains
http_access deny all

cache deny all
cache_dir null /tmp
cache_mem 16 MB
maximum_object_size 512 KB
request_body_max_size 1 MB
request_header_max_size 32 KB
reply_header_max_size 64 KB

access_log none
cache_log /dev/null
cache_store_log none
logfile_rotate 0
via off
forwarded_for delete
follow_x_forwarded_for deny all
request_header_access X-Forwarded-For deny all
request_header_access Via deny all

connect_timeout 10 seconds
request_timeout 90 seconds
read_timeout 90 seconds
client_lifetime 5 minutes
pconn_lifetime 2 minutes
shutdown_lifetime 1 seconds
half_closed_clients off
pipeline_prefetch off
memory_pools off
uri_whitespace deny
workers 1

pid_filename /tmp/squid.pid
coredump_dir /tmp
