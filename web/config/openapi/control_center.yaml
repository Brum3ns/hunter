    post:
      tags: ["Ansible Executor Protocol"]
      security: [ { runnerBearerAuth: [] } ]
      summary: "Submit an idempotent terminal utility-task result"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AnsibleMachineTaskResult" } } } }
