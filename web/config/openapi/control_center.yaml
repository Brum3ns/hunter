        "200": { description: "Current cancellation state.", content: { application/json: { schema: { type: object, properties: { id: { type: integer }, status: { type: string }, cancel_requested: { type: boolean } }, required: [id, status, cancel_requested] } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientScope" }
        "404": { $ref: "#/components/responses/NotFound" }
