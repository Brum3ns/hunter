  /api/v1/ansible_executor/runs/{id}/heartbeat:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: X-Ansible-Lease, in: header, required: true, schema: { type: string, minLength: 32 } }
    post:
      tags: ["Ansible Executor Protocol"]
      security: [ { runnerBearerAuth: [] } ]
      summary: "Extend an active run lease"
      responses:
        "200": { description: "Updated run state.", content: { application/json: { schema: { $ref: "#/components/schemas/AnsibleMachineRunState" } } } }
