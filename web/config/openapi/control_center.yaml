  /api/v1/control_center/templates:
    get:
      tags: ["Control Center"]
      summary: "List templates"
      description: "All Whiterabbit command templates, ordered by name."
      responses:
        "200":
          description: "Templates."
          content: { application/json: { schema: { type: object, properties: { templates: { type: array, items: { $ref: "#/components/schemas/CcTemplate" } } }, required: [templates] } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: ["Control Center"]
      summary: "Create a template"
      description: "Create a template from either structured fields or a raw `yaml` string. Returns 422 with an errors array on invalid input."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CcTemplateInput" } } }
      responses:
        "201": { description: "Created.", content: { application/json: { schema: { $ref: "#/components/schemas/CcTemplate" } } } }
        "422": { $ref: "#/components/responses/CcUnprocessable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/control_center/templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: ["Control Center"]
      summary: "Get one template"
      description: "Fetch a template by id."
      responses:
        "200": { description: "The template.", content: { application/json: { schema: { $ref: "#/components/schemas/CcTemplate" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: ["Control Center"]
      summary: "Update a template"
      description: "Update from structured fields or a raw `yaml` string."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CcTemplateInput" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { $ref: "#/components/schemas/CcTemplate" } } } }
        "422": { $ref: "#/components/responses/CcUnprocessable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["Control Center"]
      summary: "Update a template (PUT alias)"
      description: "Identical to PATCH."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CcTemplateInput" } } } }
      responses:
        "200": { description: "Updated.", content: { application/json: { schema: { $ref: "#/components/schemas/CcTemplate" } } } }
        "422": { $ref: "#/components/responses/CcUnprocessable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: ["Control Center"]
      summary: "Delete a template"
      description: "Remove a template. Returns 204 on success."
      responses:
        "204": { description: "Deleted." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/control_center/templates/validate:
    post:
      tags: ["Control Center"]
      summary: "Validate structured template fields"
      description: "Dry-run a structured template; returns validity, errors, and the rendered YAML without persisting."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CcTemplateInput" } } } }
      responses:
        "200":
          description: "Validation result."
          content: { application/json: { schema: { type: object, properties: { valid: { type: boolean }, errors: { type: array, items: { type: string } }, yaml: { type: string } }, required: [valid, errors, yaml] } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/control_center/templates/validate_yaml:
    post:
      tags: ["Control Center"]
      summary: "Validate a raw YAML template"
      description: "Parse a raw `yaml` string; returns validity, errors, and the parsed attributes without persisting."
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { yaml: { type: string } }, required: [yaml] } } } }
      responses:
        "200":
          description: "Validation result."
          content: { application/json: { schema: { type: object, properties: { valid: { type: boolean }, errors: { type: array, items: { type: string } }, template: { type: [object, "null"], additionalProperties: true } }, required: [valid, errors] } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/control_center/jobs:
    get:
      tags: ["Control Center"]
      summary: "List jobs"
      description: "Recent Whiterabbit jobs, newest first."
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: "Jobs."
          content: { application/json: { schema: { type: object, properties: { jobs: { type: array, items: { $ref: "#/components/schemas/CcJob" } } }, required: [jobs] } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: ["Control Center"]
      summary: "Submit a job"
      description: "Run a template (by name) against a target list via Whiterabbit. Returns 422 if the template's commands fail validation."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template: { type: string, description: "Template name." }
                targets: { type: array, items: { type: string } }
                queue_name: { type: string, default: "test" }
                target_chunk: { type: integer }
                delay: { type: integer }
              required: [template]
      responses:
        "201": { description: "Job recorded and submitted.", content: { application/json: { schema: { $ref: "#/components/schemas/CcJob" } } } }
        "422": { $ref: "#/components/responses/CcUnprocessable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/control_center/jobs/{id}:
    get:
      tags: ["Control Center"]
      summary: "Get one job"
      description: "Fetch a job by id."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "The job.", content: { application/json: { schema: { $ref: "#/components/schemas/CcJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/control_center/health:
    get:
      tags: ["Control Center"]
      summary: "Backend health"
      description: "RabbitMQ and Mongo reachability for the Whiterabbit backend."
      responses:
        "200":
          description: "Health snapshot."
          content:
            application/json:
              schema:
                type: object
                properties:
                  rabbitmq: { type: object, properties: { ok: { type: boolean }, detail: { type: string } } }
                  mongo: { type: object, properties: { ok: { type: boolean }, detail: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/control_center/stats:
    get:
      tags: ["Control Center"]
      summary: "Job dashboard stats"
      description: "Aggregate job counts, success rate, top templates, per-queue and last-30-days daily counts."
      responses:
        "200":
          description: "Stats payload."
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals: { type: object, additionalProperties: true }
                  by_status: { type: array, items: { type: object, additionalProperties: true } }
                  top_templates: { type: array, items: { type: object, additionalProperties: true } }
                  by_queue: { type: array, items: { type: object, additionalProperties: true } }
                  daily: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  # NOTE: no `responses:` block here — CcUnprocessable is defined in base.yaml
  # (the service merges only paths + schemas from fragments). This fragment
  # only $ref's it.
  schemas:
    AnsibleMachineTaskClaim:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [syntax_check, host_key_scan, connectivity_test] }
        lease: { type: string, format: password, writeOnly: true }
        lease_expires_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true, writeOnly: true, description: "One-time decrypted execution payload; never returned by human APIs." }
      required: [id, kind, lease, lease_expires_at, payload]
    AnsibleMachineRunClaim:
      type: object
      properties:
        id: { type: integer }
        run_group_id: { type: integer }
        lease: { type: string, format: password, writeOnly: true }
        lease_expires_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true, writeOnly: true, description: "One-time decrypted execution payload; never returned by human APIs." }
      required: [id, run_group_id, lease, lease_expires_at, payload]
    AnsibleMachineTaskState:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string }
        status: { type: string }
        heartbeat_at: { type: [string, "null"], format: date-time }
        lease_expires_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
      required: [id, kind, status]
    AnsibleMachineRunState:
      type: object
      properties:
        id: { type: integer }
        status: { type: string }
        heartbeat_at: { type: [string, "null"], format: date-time }
        lease_expires_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
      required: [id, status]
    AnsibleMachineTaskResult:
      type: object
      properties:
        status: { type: string, enum: [succeeded, failed, canceled] }
        result: { type: object, additionalProperties: true }
        error_code: { type: [string, "null"] }
        error_detail: { type: [string, "null"], maxLength: 4096 }
      required: [status, result]
    AnsibleMachineRunResult:
      type: object
      properties:
        status: { type: string, enum: [succeeded, failed, canceled] }
        exit_status: { type: [integer, "null"] }
        ok_count: { type: integer, minimum: 0 }
        changed_count: { type: integer, minimum: 0 }
        failed_count: { type: integer, minimum: 0 }
        unreachable_count: { type: integer, minimum: 0 }
        error_code: { type: [string, "null"] }
        error_detail: { type: [string, "null"], maxLength: 4096 }
      required: [status, ok_count, changed_count, failed_count, unreachable_count]
    AnsibleMachineRunEvent:
      type: object
      properties:
        event_uuid: { type: string }
        parent_uuid: { type: [string, "null"] }
        counter: { type: integer, minimum: 0 }
        event_type: { type: string }
        play: { type: [string, "null"] }
        task: { type: [string, "null"] }
        host: { type: [string, "null"] }
        event_time: { type: [string, "null"], format: date-time }
        stdout: { type: [string, "null"], description: "Executor-redacted output; Rails applies a second redaction boundary." }
        event_data: { type: object, additionalProperties: true }
      required: [event_uuid, counter, event_type]
    CcAnsibleCredential:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        auth_type: { type: string, enum: [private_key, password] }
        username: { type: string }
        public_key_fingerprint: { type: [string, "null"] }
        private_key_configured: { type: boolean }
        ssh_password_configured: { type: boolean }
        private_key_passphrase_configured: { type: boolean }
        become_password_configured: { type: boolean }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, auth_type, username, private_key_configured, ssh_password_configured, private_key_passphrase_configured, become_password_configured]
    CcAnsibleCredentialInput:
      type: object
      properties:
        name: { type: string }
        auth_type: { type: string, enum: [private_key, password] }
        username: { type: string }
        private_key: { type: string, writeOnly: true }
        ssh_password: { type: string, writeOnly: true }
        private_key_passphrase: { type: string, writeOnly: true }
        become_password: { type: string, writeOnly: true }
        clear_private_key: { type: boolean, default: false }
        clear_ssh_password: { type: boolean, default: false }
        clear_private_key_passphrase: { type: boolean, default: false }
        clear_become_password: { type: boolean, default: false }
      required: [name, auth_type, username]
    AnsiblePlaybook:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, "null"] }
        yaml_content: { type: string }
        checksum: { type: string }
        variable_set_ids: { type: array, items: { type: integer } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, yaml_content, checksum, variable_set_ids, created_at, updated_at]
    AnsiblePlaybookInput:
      type: object
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        yaml_content: { type: string, maxLength: 262144 }
        variable_set_ids: { type: array, items: { type: integer }, uniqueItems: true }
      required: [name, yaml_content]
    AnsibleInventory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, "null"] }
        yaml_content: { type: string }
        checksum: { type: string }
        default_credential_id: { type: [integer, "null"] }
        variable_set_ids: { type: array, items: { type: integer } }
        known_hosts_configured: { type: boolean }
        host_key_fingerprints: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, yaml_content, checksum, variable_set_ids, known_hosts_configured, host_key_fingerprints, created_at, updated_at]
    AnsibleInventoryInput:
      type: object
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        yaml_content: { type: string, maxLength: 262144 }
        default_credential_id: { type: [integer, "null"] }
        variable_set_ids: { type: array, items: { type: integer }, uniqueItems: true }
      required: [name, yaml_content]
    AnsibleVariableSet:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, "null"] }
        variables: { type: array, items: { $ref: "#/components/schemas/AnsibleVariable" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, variables, created_at, updated_at]
    AnsibleVariableSetInput:
      type: object
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
      required: [name]
    AnsibleVariable:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        value_type: { type: string, enum: [string, number, boolean, list, dictionary] }
        secret: { type: boolean }
        configured: { type: boolean }
        value:
          type: [string, number, integer, boolean, array, object, "null"]
          readOnly: true
          description: "Typed value for non-secret variables; always null when secret is true."
        position: { type: integer, minimum: 0 }
      required: [id, name, value_type, secret, configured, value, position]
    AnsibleVariableInput:
      type: object
      properties:
        name: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        value_type: { type: string, enum: [string, number, boolean, list, dictionary] }
        secret: { type: boolean }
        value: { description: "Typed value or a safe YAML/JSON fragment for lists and dictionaries.", writeOnly: true }
        position: { type: integer, minimum: 0 }
        clear_value: { type: boolean, default: false }
      required: [name, value_type, value]
    AnsibleValidationResult:
      type: object
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { type: string } }
      required: [valid, errors]
    ValidationError:
      type: object
      properties:
        error: { type: string, const: unprocessable_entity }
        details:
          type: object
          additionalProperties: { type: array, items: { type: string } }
      required: [error, details]
    AnsibleLaunchInput:
      type: object
      properties:
        playbook_id: { type: integer }
        inventory_id: { type: integer }
        credential_id: { type: [integer, "null"] }
        variable_set_ids: { type: array, items: { type: integer }, uniqueItems: true }
        overrides:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value_type: { type: string, enum: [string, number, boolean, list, dictionary] }
              value: { writeOnly: true }
              secret: { type: boolean }
            required: [name, value_type, value, secret]
        host_limit: { type: [string, "null"] }
        check_mode: { type: boolean, default: false }
        timeout_seconds: { type: integer, minimum: 60, maximum: 86400, default: 3600 }
      required: [playbook_id, inventory_id]
    AnsibleExecutorTask:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [syntax_check, host_key_scan, connectivity_test] }
        status: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        result: { type: object, additionalProperties: true }
        error_code: { type: [string, "null"] }
        error_detail: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, kind, status, result, created_at, updated_at]
    AnsibleHostKeyConfirmationInput:
      type: object
      properties:
        candidates:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              host: { type: string }
              port: { type: integer, minimum: 1, maximum: 65535 }
              known_hosts_line: { type: string }
              scanned_fingerprint: { type: string }
              expected_fingerprint: { type: string, description: "Entered from an independent trusted channel." }
            required: [host, port, known_hosts_line, scanned_fingerprint, expected_fingerprint]
      required: [candidates]
    AnsibleRunGroupSummary:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [queued, running, succeeded, failed, partially_succeeded, canceling, canceled] }
        execution_mode: { type: string, enum: [sequential, parallel] }
        failure_policy: { type: string, enum: [stop, continue] }
        concurrency_limit: { type: integer }
        inventory_id: { type: [integer, "null"] }
        credential_id: { type: [integer, "null"] }
        launch_snapshot: { type: object, additionalProperties: true }
        cancel_requested_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, status, execution_mode, failure_policy, concurrency_limit, launch_snapshot, created_at, updated_at]
    AnsibleRunGroup:
      allOf:
        - { $ref: "#/components/schemas/AnsibleRunGroupSummary" }
        - type: object
          properties:
            runs: { type: array, items: { $ref: "#/components/schemas/AnsibleRun" } }
          required: [runs]
    AnsibleRun:
      type: object
      properties:
        id: { type: integer }
        run_group_id: { type: integer }
        playbook_id: { type: [integer, "null"] }
        position: { type: integer }
        status: { type: string, enum: [waiting, queued, validating, running, succeeded, failed, canceling, canceled, skipped] }
        playbook_name: { type: string }
        inventory_name: { type: string }
        credential_name: { type: string }
        credential_fingerprint: { type: [string, "null"] }
        variable_audit: { type: object, additionalProperties: true }
        secret_variable_names: { type: array, items: { type: string } }
        host_limit: { type: [string, "null"] }
        check_mode: { type: boolean }
        timeout_seconds: { type: integer }
        error_code: { type: [string, "null"] }
        error_detail: { type: [string, "null"] }
        exit_status: { type: [integer, "null"] }
        ok_count: { type: integer }
        changed_count: { type: integer }
        failed_count: { type: integer }
        unreachable_count: { type: integer }
        stored_event_bytes: { type: integer }
        truncated: { type: boolean }
        queued_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        cancel_requested_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, position, status, playbook_name, inventory_name, credential_name, check_mode, timeout_seconds, truncated]
    AnsibleRunEvent:
      type: object
      properties:
        id: { type: integer }
        event_uuid: { type: string }
        parent_uuid: { type: [string, "null"] }
        counter: { type: integer }
        event_type: { type: string }
        play: { type: [string, "null"] }
        task: { type: [string, "null"] }
        host: { type: [string, "null"] }
        event_time: { type: [string, "null"], format: date-time }
        stdout: { type: [string, "null"], description: "Redacted output." }
        event_data: { type: object, additionalProperties: true, description: "Redacted structured event data." }
        truncated: { type: boolean }
        created_at: { type: string, format: date-time }
      required: [id, event_uuid, counter, event_type, event_data, truncated, created_at]
    AnsibleExecutorHealth:
      type: object
      properties:
        configured_runners: { type: integer }
        active_runners: { type: integer }
        last_seen_at: { type: [string, "null"], format: date-time }
        oldest_queued_age_seconds: { type: [integer, "null"] }
      required: [configured_runners, active_runners]
    CcTemplate:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string }
        tags: { type: array, items: { type: string } }
        description: { type: [string, "null"] }
        output: { type: [string, "null"] }
        commands: { type: array, items: { type: object, additionalProperties: true } }
        target: { type: [object, "null"], additionalProperties: true }
        created_by: { type: [string, "null"] }
        yaml: { type: string, description: "Rendered YAML form." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CcTemplateInput:
      type: object
      description: "Either structured fields OR a raw `yaml` string (yaml wins if both are present)."
      properties:
        yaml: { type: string }
        name: { type: string }
        kind: { type: string }
        description: { type: string }
        output: { type: string }
        tags: { type: array, items: { type: string } }
        commands: { type: array, items: { type: object, properties: { command: { type: string }, operator: { type: string }, args: { type: array, items: { type: string } } } } }
        target: { type: object, properties: { type: { type: string }, separator: { type: string }, output: { type: string } } }
    CcJob:
      type: object
      properties:
        id: { type: integer }
        template_name: { type: string }
        queue_name: { type: string }
        target_count: { type: integer }
        status: { type: string, enum: [pending, succeeded, failed] }
        exit_status: { type: [integer, "null"] }
        stdout: { type: [string, "null"] }
        stderr: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
