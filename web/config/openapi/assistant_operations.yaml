components:
  schemas:
    AssistantVulnerabilityInput:
      type: object
      properties:
        name: { type: string, maxLength: 500 }
        severity: { type: string, maxLength: 32 }
        type: { type: string, maxLength: 200 }
        cwe: { type: string, maxLength: 64 }
        status: { type: string, maxLength: 64 }
        program: { type: string, maxLength: 255 }
        tool: { type: string, maxLength: 255 }
        asset: { type: string, maxLength: 2048 }
        description: { type: string, maxLength: 16384 }
        impact: { type: string, maxLength: 16384 }
        host: { type: string, maxLength: 2048 }
        url: { type: string, maxLength: 8192 }
        ip: { type: string, maxLength: 128 }
        method: { type: string, maxLength: 32 }
        request: { type: string, maxLength: 16384 }
