        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: bounty, in: query, schema: { type: string } }
        - { name: collaboration, in: query, schema: { type: string } }
        - { name: favorites_only, in: query, schema: { type: string, enum: [yes, no] } }
        - { name: trash_only, in: query, schema: { type: string, enum: [yes, no] } }
        - { name: bounty_min_gte, in: query, schema: { type: string } }
        - { name: bounty_max_gte, in: query, schema: { type: string } }
        - { name: reports_gte, in: query, schema: { type: string } }
        - { name: reports_24h_gte, in: query, schema: { type: string } }
        - { name: reports_7d_gte, in: query, schema: { type: string } }
        - { name: reports_month_gte, in: query, schema: { type: string } }
        - { name: scope_count_gte, in: query, schema: { type: string } }
        - { name: scope_count_lte, in: query, schema: { type: string } }
        - { name: response_lte, in: query, schema: { type: string } }
        - { name: platforms, in: query, schema: { type: string } }
        - { name: scope_types, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (programs) page of program summaries plus count." }
        "403": { description: "The tool is not granted." }
  /api/v1/assistant/machine/programs/{id}:
    get:
      tags: ["Assistant Machine"]
      summary: "Fetch one program by id"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (programs) full program." }
        "403": { description: "The tool is not granted." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/machine/control_center/templates:
    get:
      tags: ["Assistant Machine"]
      summary: "List and count Control Center Whiterabbit templates"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: kind, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (control_center_templates) page of template summaries plus count." }
        "403": { description: "The tool is not granted." }
    post:
      tags: ["Assistant Machine"]
      summary: "Create a Whiterabbit template"
      description: "Approval-free create (never overwrite/delete/run), validated server-side; gated by the control_center_write_enabled toggle and the control_center_templates_write grant scope."
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/AssistantTurnGrant" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: object
                  properties:
                    name: { type: string, minLength: 1, maxLength: 200 }
                    kind: { type: string, enum: [cmdscript, workflow] }
                    tags: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
                    description: { type: string, maxLength: 4000 }
                    output: { type: string, maxLength: 4000 }
                    commands: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/AssistantWhiterabbitCommand" } }
                    target: { $ref: "#/components/schemas/AssistantWhiterabbitTarget" }
                  required: [name, kind, commands]
                  additionalProperties: false
              required: [template]
              additionalProperties: false
      responses:
        "201": { description: "Created; returns correlation_id and template:{id, name, lock_version}." }
        "409": { description: "name_conflict; no existing template was changed." }
        "403": { description: "The write toggle is off or the grant lacks control_center_templates_write." }
        "422": { description: "Template validation or creation failed." }
        "429": { description: "The create rate limit was reached." }
  /api/v1/assistant/machine/control_center/templates/{id}:
    get:
      tags: ["Assistant Machine"]
      summary: "Fetch one Control Center template by id"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (control_center_templates) full template." }
        "403": { description: "The tool is not granted." }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: ["Assistant Machine"]
      summary: "Explicitly edit a Whiterabbit template"
      description: "Approval-free only after an explicit user edit request. Requires the current lock version, validates the complete merged template, and cannot delete or run."
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_lock_version, changes]
              properties:
                expected_lock_version: { type: integer, minimum: 0 }
                changes:
                  type: object
                  minProperties: 1
                  properties:
                    name: { type: string, minLength: 1, maxLength: 200 }
                    kind: { type: string, enum: [cmdscript, workflow] }
                    tags: { type: array, maxItems: 50, items: { type: string, maxLength: 200 } }
                    description: { type: string, maxLength: 4000 }
                    output: { type: string, maxLength: 4000 }
                    commands: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/AssistantWhiterabbitCommand" } }
                    target: { $ref: "#/components/schemas/AssistantWhiterabbitTarget" }
                  additionalProperties: false
              additionalProperties: false
      responses:
        "200": { description: "Updated; returns correlation_id and template:{id, name, lock_version}." }
        "403": { description: "Authoring is disabled or the exact edit scope is absent." }
        "404": { description: "artifact_not_found" }
        "409": { description: "destination_stale or name_conflict; no edit was applied." }
        "422": { description: "Closed input or complete-state validation failed." }
        "429": { description: "The edit rate limit was reached." }
  /api/v1/assistant/machine/control_center/jobs:
    get:
      tags: ["Assistant Machine"]
      summary: "List and count Control Center jobs"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (control_center_jobs) page of job summaries plus count, excluding template_snapshot, selections, manual_targets, and idempotency_key." }
        "403": { description: "The tool is not granted." }
  /api/v1/assistant/machine/control_center/jobs/{id}:
    get:
      tags: ["Assistant Machine"]
      summary: "Fetch one Control Center job by id"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "A bounded job with safe attribution, selection/target counts and sources, execution parameters, and sanitized stdout/stderr; raw selectors, targets, snapshots, and idempotency keys are excluded." }
        "403": { description: "The tool is not granted." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/machine/control_center/ansible/playbooks:
    get:
      tags: ["Assistant Machine"]
      summary: "List and count Control Center ansible playbooks"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (control_center_ansible) page of playbook summaries plus count." }
        "403": { description: "The tool is not granted." }
    post:
      tags: ["Assistant Machine"]
      summary: "Create an Ansible playbook"
      description: "Approval-free create (never overwrite/delete/run), validated server-side; gated by the control_center_write_enabled toggle and the control_center_ansible_write grant scope."
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/AssistantTurnGrant" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playbook:
                  type: object
                  properties:
                    name: { type: string, minLength: 1, maxLength: 200 }
                    description: { type: string, maxLength: 4000 }
                    source: { type: string, minLength: 1, maxLength: 65536 }
                    variable_set_ids: { type: array, maxItems: 100, uniqueItems: true, items: { type: integer, minimum: 1 } }
                  required: [name, source]
                  additionalProperties: false
              required: [playbook]
              additionalProperties: false
      responses:
        "201": { description: "Created; returns correlation_id and playbook:{id, name, lock_version}." }
        "409": { description: "name_conflict; no existing playbook was changed." }
        "403": { description: "The write toggle is off or the grant lacks control_center_ansible_write." }
        "422": { description: "Playbook validation or creation failed." }
        "429": { description: "The create rate limit was reached." }
  /api/v1/assistant/machine/control_center/ansible/playbooks/{id}:
