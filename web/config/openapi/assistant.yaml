  /api/v1/assistant/conversations:
    get:
      tags: ["Assistant"]
      summary: "List owned assistant conversations"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: "Owned conversations." }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: ["Assistant"]
      summary: "Create an assistant conversation"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                backend: { type: string, enum: [codex, claude_code] }
              required: [backend]
              additionalProperties: false
      responses:
        "201": { description: "Created conversation pinned to the selected direct backend." }
        "400": { description: "The request body is not exactly one string backend." }
        "403": { description: "Invalid CSRF token or administrator required." }
        "404": { description: "The direct backend is unknown, disabled, or unreviewed." }
        "503": { description: "The assistant kill switch is off." }
  /api/v1/assistant/conversations/{id}:
    get:
      tags: ["Assistant"]
      summary: "Get one owned assistant conversation"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: "Conversation with decrypted messages for its owner." }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: ["Assistant"]
      summary: "Rename one owned assistant conversation"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
              required: [title]
              additionalProperties: false
      responses:
        "200": { description: "Renamed owned conversation." }
        "400": { description: "The request body is not the exact closed rename shape." }
        "403": { description: "Invalid CSRF token or administrator required." }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "The normalized title is blank or too long." }
        "503": { description: "Assistant activation or conversation management is disabled." }
    delete:
      tags: ["Assistant"]
      summary: "Delete one owned assistant conversation"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: "Conversation content was hard-deleted." }
        "403": { description: "Invalid CSRF token or administrator required." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/conversations/order:
    patch:
      tags: ["Assistant"]
      summary: "Reorder the complete owned assistant conversation history"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_ids:
                  type: array
                  maxItems: 1000
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
              required: [conversation_ids]
              additionalProperties: false
      responses:
        "200": { description: "Authoritative reordered owned conversation list." }
        "400": { description: "The request body is not the exact closed reorder shape." }
        "403": { description: "Invalid CSRF token or administrator required." }
        "409": { description: "The complete owned conversation set changed." }
        "422": { description: "The order contains invalid or duplicate IDs." }
        "503": { description: "Assistant activation or conversation management is disabled." }
  /api/v1/assistant/conversations/{conversation_id}/turns:
    post:
      tags: ["Assistant"]
      summary: "Create and dispatch an owned assistant turn"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: conversation_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, minLength: 1, maxLength: 65536 }
                contexts:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    properties: { type: { type: string }, id: { type: string } }
                    required: [type, id]
                    additionalProperties: false
              required: [message, contexts]
              additionalProperties: false
      responses:
        "202": { description: "The persisted turn is queued; no raw grant is returned." }
        "403": { description: "Invalid CSRF token or administrator required." }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The conversation uses a retired legacy provider." }
        "422": { description: "The turn or an exact context reference is invalid." }
        "429": { description: "The per-user turn-start or concurrency limit was reached." }
        "503": { description: "The assistant is disabled or dispatch was interrupted." }
  /api/v1/assistant/turns/{id}:
    get:
      tags: ["Assistant"]
      summary: "Poll one owned assistant turn"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: "Turn state, messages, disclosed context references, and draft summaries." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/turns/{id}/cancel:
    post:
      tags: ["Assistant"]
      summary: "Cancel one owned assistant turn"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: "Turn is terminal and its active grant is revoked." }
        "403": { description: "Invalid CSRF token or administrator required." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/drafts/{id}:
    get:
      tags: ["Assistant"]
      summary: "Review one owned assistant draft"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: "Escaped source and server-derived validation/save eligibility." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/drafts/{draft_id}/confirmed_save:
    post:
      tags: ["Assistant"]
      summary: "Save a fully reviewed and revalidated assistant draft"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: draft_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmation:
                  type: object
                  properties:
                    name: { type: string, maxLength: 200 }
                    content_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
                    validation_version: { type: string }
                    diff_digest: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
                    destination:
                      type: [object, "null"]
                      properties:
                        type: { type: string, enum: [whiterabbit_template, ansible_playbook] }
                        id: { type: string }
                        lock_version: { type: string }
                      required: [type, id, lock_version]
                      additionalProperties: false
                  required: [name, content_digest, validation_version, diff_digest, destination]
                  additionalProperties: false
              required: [confirmation]
              additionalProperties: false
      responses:
        "200": { description: "An existing artifact was updated after current validation and optimistic-lock confirmation." }
        "201": { description: "A new artifact was created after current validation and confirmation." }
        "403": { description: "Invalid CSRF token or administrator required." }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The reviewed destination is stale or missing." }
        "422": { description: "Confirmation, current validation, or domain persistence failed." }
  /api/v1/assistant/provider_profiles:
    get:
      tags: ["Assistant"]
      summary: "List approved assistant provider profiles"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: "Profiles without credentials or endpoint configuration." } }
    post:
      tags: ["Assistant"]
      summary: "Create an approved assistant provider profile"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantProviderProfileInput" }
      responses:
        "201": { description: "Created provider profile." }
        "422": { description: "Profile validation failed." }
  /api/v1/assistant/provider_profiles/{id}:
    get:
      tags: ["Assistant"]
      summary: "Get an approved assistant provider profile"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: "Safe profile metadata." }, "404": { $ref: "#/components/responses/NotFound" } }
    patch:
      tags: ["Assistant"]
      summary: "Update an approved assistant provider profile"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssistantProviderProfileInput" } } } }
      responses: { "200": { description: "Updated provider profile." }, "422": { description: "Profile validation failed." } }
    put:
      tags: ["Assistant"]
      summary: "Replace allowed assistant provider profile fields"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssistantProviderProfileInput" } } } }
      responses: { "200": { description: "Updated provider profile." }, "422": { description: "Profile validation failed." } }
    delete:
      tags: ["Assistant"]
      summary: "Delete an unused assistant provider profile"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: "Deleted provider profile." }, "422": { description: "The profile is still referenced." } }
  /api/v1/assistant/settings:
    get:
      tags: ["Assistant"]
      summary: "Get assistant kill-switch and retention settings"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: "Bounded assistant settings." } }
    patch:
      tags: ["Assistant"]
      summary: "Update assistant kill-switch and retention settings"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssistantSettingsInput" } } } }
      responses: { "200": { description: "Updated settings." }, "422": { description: "Retention is outside hard bounds." } }
    put:
      tags: ["Assistant"]
      summary: "Replace allowed assistant setting fields"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssistantSettingsInput" } } } }
      responses: { "200": { description: "Updated settings." }, "422": { description: "Retention is outside hard bounds." } }
components:
  schemas:
    AssistantWhiterabbitCommand:
      type: object
      properties:
        command: { type: string, minLength: 1, maxLength: 255 }
        args: { type: array, maxItems: 200, items: { type: string, maxLength: 4096 } }
        operator: { type: string, enum: ["", "|", "&&", "||"] }
      required: [command]
      additionalProperties: false
    AssistantWhiterabbitTarget:
      type: object
      properties:
        type: { type: string, maxLength: 100 }
        separator: { type: string, maxLength: 20 }
        output: { type: string, maxLength: 4000 }
      additionalProperties: false
    AssistantProviderProfileInput:
      type: object
      properties:
        provider_profile:
          type: object
          properties:
            name: { type: string, maxLength: 200 }
            catalog_slug: { type: string }
            enabled: { type: boolean }
            tool_call_limit: { type: integer, minimum: 1, maximum: 8 }
            retention_posture: { type: string, enum: [standard, zero_data_retention] }
            reviewed_at: { type: string, format: date-time }
          additionalProperties: false
      required: [provider_profile]
      additionalProperties: false
    AssistantSettingsInput:
      type: object
      properties:
        settings:
          type: object
          properties:
            assistant_enabled: { type: boolean }
            control_center_write_enabled: { type: boolean }
            conversation_management_enabled: { type: boolean }
            transcript_retention_days: { type: integer, minimum: 1, maximum: 30 }
            audit_retention_days: { type: integer, minimum: 1, maximum: 365 }
          additionalProperties: false
      required: [settings]
      additionalProperties: false
