        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (control_center_ansible) full playbook." }
        "403": { description: "The tool is not granted." }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: ["Assistant Machine"]
      summary: "Explicitly edit an Ansible playbook"
      description: "Approval-free only after an explicit user edit request. Requires the current lock version, validates the complete merged playbook, and cannot delete or run."
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_lock_version, changes]
              properties:
                expected_lock_version: { type: integer, minimum: 0 }
                changes:
                  type: object
                  minProperties: 1
                  properties:
                    name: { type: string, minLength: 1, maxLength: 200 }
                    description: { type: string, maxLength: 4000 }
                    source: { type: string, minLength: 1, maxLength: 65536 }
                    variable_set_ids: { type: array, maxItems: 100, uniqueItems: true, items: { type: integer, minimum: 1 } }
                  additionalProperties: false
              additionalProperties: false
      responses:
        "200": { description: "Updated; returns correlation_id and playbook:{id, name, lock_version}." }
        "403": { description: "Authoring is disabled or the exact edit scope is absent." }
        "404": { description: "artifact_not_found" }
        "409": { description: "destination_stale or name_conflict; no edit was applied." }
        "422": { description: "Closed input or complete-state validation failed." }
        "429": { description: "The edit rate limit was reached." }
  /api/v1/assistant/machine/control_center/ansible/run_groups:
