      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (control_center_ansible) page of run-group summaries plus count." }
        "403": { description: "The tool is not granted." }
  /api/v1/assistant/machine/control_center/ansible/run_groups/{id}:
    get:
      tags: ["Assistant Machine"]
      summary: "Fetch one Control Center ansible run group by id"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (control_center_ansible) full run group, including its runs, excluding execution_payload." }
        "403": { description: "The tool is not granted." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/machine/control_center/ansible/runs/{id}:
    get:
      tags: ["Assistant Machine"]
      summary: "Fetch one Control Center ansible run by id"
      x-internal-machine: true
