    put:
      tags: ["Assistant"]
      summary: "Replace allowed assistant setting fields"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AssistantSettingsInput" } } } }
      responses: { "200": { description: "Updated settings." }, "422": { description: "Retention is outside hard bounds." } }
components:
  schemas:
    AssistantProviderProfileInput:
      type: object
      properties:
        provider_profile:
          type: object
          properties:
            name: { type: string, maxLength: 200 }
            catalog_slug: { type: string }
            enabled: { type: boolean }
            tool_call_limit: { type: integer, minimum: 1, maximum: 8 }
            retention_posture: { type: string, enum: [standard, zero_data_retention] }
            reviewed_at: { type: string, format: date-time }
          additionalProperties: false
      required: [provider_profile]
      additionalProperties: false
    AssistantSettingsInput:
      type: object
      properties:
        settings:
          type: object
          properties:
            assistant_enabled: { type: boolean }
            transcript_retention_days: { type: integer, minimum: 1, maximum: 30 }
            audit_retention_days: { type: integer, minimum: 1, maximum: 365 }
          additionalProperties: false
      required: [settings]
      additionalProperties: false
