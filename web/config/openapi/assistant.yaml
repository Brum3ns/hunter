      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (cves) full CVE." }
        "403": { description: "The tool is not granted." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/machine/vulnerabilities:
    get:
      tags: ["Assistant Machine"]
      summary: "List and count vulnerabilities"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: q, in: query, schema: { type: string } }
        - { name: program, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: tool, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (vulnerabilities) page of vulnerability summaries plus count, excluding raw request/response, poc, and operator PII." }
        "403": { description: "The tool is not granted." }
  /api/v1/assistant/machine/vulnerabilities/{id}:
    get:
      tags: ["Assistant Machine"]
      summary: "Fetch one vulnerability by id"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "A bounded vulnerability with sanitized request/response/curl/extracted evidence and redaction flags; scan IDs, internal reasoning, secrets, and operator PII are excluded." }
        "403": { description: "The tool is not granted." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/machine/sitemap/endpoints:
    get:
      tags: ["Assistant Machine"]
