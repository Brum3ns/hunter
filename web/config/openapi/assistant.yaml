      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: run_id, in: query, required: true, schema: { type: integer } }
        - { name: after_counter, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (control_center_ansible) cursor page of run-event summaries for one run." }
        "403": { description: "The tool is not granted." }
