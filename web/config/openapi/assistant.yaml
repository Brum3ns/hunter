        - { name: has_query, in: query, schema: { type: string } }
        - { name: content_type, in: query, schema: { type: string } }
        - { name: methods, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (sitemap) page of sitemap endpoint summaries plus count." }
        "403": { description: "The tool is not granted." }
  /api/v1/assistant/machine/sitemap/endpoints/{id}:
    get:
      tags: ["Assistant Machine"]
      summary: "Fetch one sitemap endpoint by id"
      x-internal-machine: true
