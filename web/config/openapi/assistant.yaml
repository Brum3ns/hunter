paths:
  /api/v1/assistant/bootstrap:
    get:
      tags: ["Assistant"]
      summary: "Load assistant administration state"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: "Assistant settings, safe profiles, and owned conversations." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The session user is not the configured assistant administrator." }
  /api/v1/assistant/context_options:
    get:
      tags: ["Assistant"]
      summary: "Find bounded assistant context options"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [program, target, cve, vulnerability, whiterabbit_template, ansible_playbook] } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { description: "At most twenty type, ID, and label rows." }
        "400": { description: "Missing or unsupported context type." }
        "503": { description: "The assistant kill switch is off." }
  /api/v1/assistant/context_previews:
    post:
      tags: ["Assistant"]
      summary: "Preview exact sanitized assistant context"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                references:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      type: { type: string, enum: [program, target, cve, vulnerability, whiterabbit_template, ansible_playbook] }
                      id: { type: string }
                    required: [type, id]
                    additionalProperties: false
              required: [references]
              additionalProperties: false
      responses:
        "200": { description: "Versioned sanitized previews for every exact reference." }
        "400": { description: "The reference list is malformed or exceeds ten entries." }
        "422": { description: "At least one reference is missing, unsafe, unsupported, or oversized; no partial preview is returned." }
        "503": { description: "The assistant kill switch is off." }
  /api/v1/assistant/machine/grant:
    get:
      tags: ["Assistant Machine"]
      summary: "Introspect the current assistant turn grant"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/AssistantTurnGrant" }]
      responses:
        "200": { description: "Exact tools, resources, expiry, correlation ID, and remaining budgets." }
        "401": { description: "Invalid assistant service identity." }
        "403": { description: "Invalid, expired, revoked, or mismatched turn grant." }
  /api/v1/assistant/machine/contexts/{resource_type}/{id}:
    get:
      tags: ["Assistant Machine"]
      summary: "Fetch one exact sanitized context record"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: resource_type, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Versioned sanitized context plus correlation ID and remaining-budget headers." }
        "403": { description: "The tool or exact resource is not granted." }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: "The sanitized result exceeded a grant limit." }
  /api/v1/assistant/machine/artifacts/{resource_type}/{id}:
    get:
      tags: ["Assistant Machine"]
      summary: "Fetch one exact sanitized artifact example"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: resource_type, in: path, required: true, schema: { type: string, enum: [whiterabbit_template, ansible_playbook] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Versioned sanitized artifact example." }
        "403": { description: "The tool or exact resource is not granted." }
        "422": { description: "Secret-pattern detection rejected the complete artifact." }
  /api/v1/assistant/machine/policies/{artifact_type}:
    get:
      tags: ["Assistant Machine"]
      summary: "Fetch a versioned assistant authoring policy"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: artifact_type, in: path, required: true, schema: { type: string, enum: [whiterabbit_template, ansible_playbook] } }
      responses:
        "200": { description: "Non-secret closed authoring policy." }
        "403": { description: "The policy tool is not granted." }
  /api/v1/assistant/machine/validations/{artifact_type}:
    post:
      tags: ["Assistant Machine"]
      summary: "Submit an effect-free assistant draft validation"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: artifact_type, in: path, required: true, schema: { type: string, enum: [whiterabbit_template, ansible_playbook] } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        "200": { description: "Synchronous Whiterabbit result or accepted asynchronous validation." }
        "429": { description: "An isolated validation is already in flight for this turn." }
        "413": { description: "Request body exceeded 64 KiB." }
        "501": { description: "Validator is not installed yet." }
  /api/v1/assistant/machine/validation_results/{id}:
    get:
      tags: ["Assistant Machine"]
      summary: "Get a turn-bound assistant validation result"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Normalized validation state and redacted codes." }
        "403": { description: "The result is not bound to the current grant." }
        "501": { description: "Validator is not installed yet." }
  /api/v1/assistant/machine/targets:
    get:
      tags: ["Assistant Machine"]
      summary: "List and count alive targets"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: q, in: query, schema: { type: string } }
        - { name: program, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (targets) page of target summaries plus count." }
        "403": { description: "The tool is not granted." }
  /api/v1/assistant/machine/targets/{id}:
    get:
      tags: ["Assistant Machine"]
      summary: "Fetch one target by id"
      x-internal-machine: true
      security: [{ assistantServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (targets) full target." }
        "403": { description: "The tool is not granted." }
        "404": { $ref: "#/components/responses/NotFound" }
