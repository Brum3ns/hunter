      parameters:
        - { $ref: "#/components/parameters/AssistantTurnGrant" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "A bounded, projection-only, grant-scoped (control_center_ansible) full run, excluding playbook_yaml, inventory_yaml, known_hosts, lease_digest, and runner_id." }
        "403": { description: "The tool is not granted." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/machine/control_center/ansible/run_events:
    get:
      tags: ["Assistant Machine"]
