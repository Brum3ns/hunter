        "403": { description: "The tool is not granted." }
        "404": { description: "The run_id query parameter is missing." }
  /api/v1/assistant/conversations:
    get:
      tags: ["Assistant"]
      summary: "List owned assistant conversations"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: "Owned conversations." }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: ["Assistant"]
      summary: "Create an assistant conversation"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { provider_profile_id: { type: integer } }
              required: [provider_profile_id]
              additionalProperties: false
      responses:
        "201": { description: "Created conversation pinned to the selected profile." }
        "403": { description: "Invalid CSRF token or administrator required." }
        "503": { description: "The assistant kill switch is off." }
  /api/v1/assistant/conversations/{id}:
    get:
      tags: ["Assistant"]
      summary: "Get one owned assistant conversation"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: "Conversation with decrypted messages for its owner." }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: ["Assistant"]
      summary: "Delete one owned assistant conversation"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: "Conversation content was hard-deleted." }
        "403": { description: "Invalid CSRF token or administrator required." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/conversations/{conversation_id}/turns:
    post:
      tags: ["Assistant"]
      summary: "Create and dispatch an owned assistant turn"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: conversation_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, minLength: 1, maxLength: 65536 }
                contexts:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    properties: { type: { type: string }, id: { type: string } }
                    required: [type, id]
                    additionalProperties: false
              required: [message, contexts]
              additionalProperties: false
      responses:
        "202": { description: "The persisted turn is queued; no raw grant is returned." }
        "403": { description: "Invalid CSRF token or administrator required." }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "The turn or an exact context reference is invalid." }
        "429": { description: "The per-user turn-start or concurrency limit was reached." }
        "503": { description: "The assistant is disabled or dispatch was interrupted." }
  /api/v1/assistant/turns/{id}:
    get:
      tags: ["Assistant"]
      summary: "Poll one owned assistant turn"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: "Turn state, messages, disclosed context references, and draft summaries." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/turns/{id}/cancel:
    post:
      tags: ["Assistant"]
      summary: "Cancel one owned assistant turn"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: "Turn is terminal and its active grant is revoked." }
        "403": { description: "Invalid CSRF token or administrator required." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/drafts/{id}:
    get:
      tags: ["Assistant"]
      summary: "Review one owned assistant draft"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: "Escaped source and server-derived validation/save eligibility." }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assistant/drafts/{draft_id}/confirmed_save:
    post:
      tags: ["Assistant"]
      summary: "Save a fully reviewed and revalidated assistant draft"
      x-session-only: true
      security: [{ sessionCookie: [] }]
      parameters: [{ name: draft_id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmation:
                  type: object
                  properties:
                    name: { type: string, maxLength: 200 }
                    content_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
                    validation_version: { type: string }
                    diff_digest: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
                    destination:
                      type: [object, "null"]
                      properties:
                        type: { type: string, enum: [whiterabbit_template, ansible_playbook] }
                        id: { type: string }
                        lock_version: { type: string }
                      required: [type, id, lock_version]
                      additionalProperties: false
                  required: [name, content_digest, validation_version, diff_digest, destination]
                  additionalProperties: false
              required: [confirmation]
              additionalProperties: false
      responses:
        "200": { description: "An existing artifact was updated after current validation and optimistic-lock confirmation." }
        "201": { description: "A new artifact was created after current validation and confirmation." }
        "403": { description: "Invalid CSRF token or administrator required." }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The reviewed destination is stale or missing." }
        "422": { description: "Confirmation, current validation, or domain persistence failed." }
  /api/v1/assistant/provider_profiles:
