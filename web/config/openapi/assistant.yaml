        - { name: ecosystem, in: query, schema: { type: string } }
        - { name: package, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string } }
        - { name: vendor, in: query, schema: { type: string } }
        - { name: cwe, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: has_fix, in: query, schema: { type: string } }
        - { name: min_severity, in: query, schema: { type: string } }
        - { name: published_after, in: query, schema: { type: string } }
        - { name: modified_after, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
