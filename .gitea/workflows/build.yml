name: Build and push images

on:
  push:
    branches: [main]

env:
  # Override per-instance by setting a repo/org variable named REGISTRY_HOST.
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
  WEB_IMAGE: ${{ gitea.repository }}-web
  RUNNER_IMAGE: ${{ gitea.repository }}-runner
  ANSIBLE_EXECUTOR_IMAGE: ${{ gitea.repository }}-ansible-executor
  ASSISTANT_GATEWAY_IMAGE: ${{ gitea.repository }}-assistant-gateway
  ASSISTANT_MCP_IMAGE: ${{ gitea.repository }}-assistant-mcp
  ASSISTANT_VALIDATOR_IMAGE: ${{ gitea.repository }}-assistant-validator
  ASSISTANT_CODEX_IMAGE: ${{ gitea.repository }}-assistant-codex
  ASSISTANT_CLAUDE_IMAGE: ${{ gitea.repository }}-assistant-claude

jobs:
  # Supply-chain and secret-leak gates on source. These must pass before any
  # image is built or pushed, so a critical/high dependency finding or a leaked
  # provider/service/grant credential fails the pipeline closed.
  security-source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can inspect every commit.
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Brakeman (Rails static analysis, fail on high-confidence findings)
        working-directory: web
        run: bundle exec brakeman --no-pager -w3 --exit-on-warn --exit-on-error

      - name: bundle-audit (locked Ruby dependency advisories)
        working-directory: web
        run: |
          gem install bundler-audit
          bundle-audit check --update

      - name: govulncheck (Go module vulnerability scan)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for module in assistant/codex assistant/claude assistant/gateway assistant/mcp assistant/validator; do
            echo "== govulncheck $module =="
            ( cd "$module" && "$(go env GOPATH)/bin/govulncheck" ./... )
          done

      - name: Assistant Go race and real Codex boundary tests
        run: |
          set -eu
          npm install -g @openai/codex@0.144.4
          test "$(codex --version)" = "codex-cli 0.144.4"

          # setup-node installs Node in its toolcache, but the real-Codex
          # contract tests replace PATH with the production image's restricted
          # value. Expose that same runtime location for this step only.
          node_bin="$(command -v node)"
          if ! env -i PATH=/usr/local/bin:/usr/bin:/bin node --version >/dev/null 2>&1; then
            node_link=/usr/local/bin/node
            if [ -e "$node_link" ] || [ -L "$node_link" ]; then
              echo "/usr/local/bin/node exists but is unavailable through the restricted PATH" >&2
              exit 1
            fi
            if [ -w /usr/local/bin ]; then
              ln -s "$node_bin" "$node_link"
              remove_node_link() { rm -f "$node_link"; }
            else
              sudo ln -s "$node_bin" "$node_link"
              remove_node_link() { sudo rm -f "$node_link"; }
            fi
            cleanup_node_link() {
              if [ "$(readlink "$node_link")" = "$node_bin" ]; then
                remove_node_link
              fi
            }
            trap cleanup_node_link EXIT
          fi
          env -i PATH=/usr/local/bin:/usr/bin:/bin node --version

          for module in assistant/codex assistant/claude assistant/gateway assistant/mcp assistant/validator; do
            ( cd "$module" && go test -race ./... )
          done
          ( cd assistant/codex && go test ./internal/chat \
            -run 'TestRealCodex(EnforcesApprovedHunterMCPBoundary|ApplyPatchCannotMutateReadOnlyWorkspace)' \
            -count=1 -v )

      - name: gitleaks (working tree and full history secret scan)
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          GITLEAKS="$(go env GOPATH)/bin/gitleaks"
          "$GITLEAKS" dir --redact --no-banner --config ops/assistant/gitleaks.toml .
          "$GITLEAKS" git --redact --no-banner --config ops/assistant/gitleaks.toml .

  build:
    runs-on: ubuntu-latest
    needs: security-source-gates
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."${{ vars.REGISTRY_HOST }}"]
              http = true

      - name: Fetch Go sources (whiterabbit, scope) from Gitea
        env:
          REGISTRY_HOST: ${{ env.REGISTRY_HOST }}
          CLONE_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          WHITERABBIT_REF: ${{ vars.WHITERABBIT_REF }}
          SCOPE_REF: ${{ vars.SCOPE_REF }}
        run: |
          rm -rf tmp/whiterabbit tmp/scope
          git clone --depth 1 --branch "${WHITERABBIT_REF:-main}" \
            "http://gadmin:${CLONE_TOKEN}@${REGISTRY_HOST}/gadmin/whiterabbit.git" tmp/whiterabbit
          git clone --depth 1 --branch "${SCOPE_REF:-main}" \
            "http://gadmin:${CLONE_TOKEN}@${REGISTRY_HOST}/gadmin/scope.git" tmp/scope

      - name: Write registry auth (HTTP registry, bypass docker login HTTPS probe)
        env:
          REGISTRY_USER: gadmin
          REGISTRY_PASS: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_HOST: ${{ env.REGISTRY_HOST }}
        run: |
          mkdir -p ~/.docker
          AUTH=$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASS" | base64 -w0)
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY_HOST" "$AUTH" > ~/.docker/config.json

      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.WEB_IMAGE }}:latest
            ${{ env.REGISTRY_HOST }}/${{ env.WEB_IMAGE }}:${{ gitea.sha }}

      - name: Build and push runner
        uses: docker/build-push-action@v5
        with:
          context: .
          file: runner/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.RUNNER_IMAGE }}:latest
            ${{ env.REGISTRY_HOST }}/${{ env.RUNNER_IMAGE }}:${{ gitea.sha }}

      - name: Build and push Ansible executor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ansible_executor/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.ANSIBLE_EXECUTOR_IMAGE }}:latest
            ${{ env.REGISTRY_HOST }}/${{ env.ANSIBLE_EXECUTOR_IMAGE }}:${{ gitea.sha }}

      - name: Build and push Assistant gateway
        uses: docker/build-push-action@v5
        with:
          context: assistant/gateway
          file: assistant/gateway/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_GATEWAY_IMAGE }}:latest
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_GATEWAY_IMAGE }}:${{ gitea.sha }}

      - name: Build and push Assistant Codex
        uses: docker/build-push-action@v5
        with:
          context: assistant/codex
          file: assistant/codex/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_CODEX_IMAGE }}:latest
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_CODEX_IMAGE }}:${{ gitea.sha }}

      - name: Build and push Assistant Claude
        uses: docker/build-push-action@v5
        with:
          context: assistant/claude
          file: assistant/claude/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_CLAUDE_IMAGE }}:latest
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_CLAUDE_IMAGE }}:${{ gitea.sha }}

      - name: Build and push Assistant MCP broker
        uses: docker/build-push-action@v5
        with:
          context: assistant/mcp
          file: assistant/mcp/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_MCP_IMAGE }}:latest
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_MCP_IMAGE }}:${{ gitea.sha }}

      - name: Build and push Assistant validator
        uses: docker/build-push-action@v5
        with:
          context: assistant/validator
          file: assistant/validator/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_VALIDATOR_IMAGE }}:latest
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_VALIDATOR_IMAGE }}:${{ gitea.sha }}

  # Image-level supply-chain, secret-leak, and runtime-isolation gates. Runs only
  # after images are built; SBOMs and scans use the exact pushed digests, and the
  # Assistant isolation drills run against the resolved Compose stack.
  security-image-gates:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: false

      - name: Install syft and grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate CycloneDX and SPDX SBOMs per Assistant image
        run: |
          mkdir -p sbom
          images="\
            ${{ env.REGISTRY_HOST }}/${{ env.WEB_IMAGE }}:${{ gitea.sha }} \
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_CODEX_IMAGE }}:${{ gitea.sha }} \
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_CLAUDE_IMAGE }}:${{ gitea.sha }} \
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_GATEWAY_IMAGE }}:${{ gitea.sha }} \
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_MCP_IMAGE }}:${{ gitea.sha }} \
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_VALIDATOR_IMAGE }}:${{ gitea.sha }}"
          for image in $images; do
            slug=$(printf '%s' "$image" | tr '/:' '__')
            syft "$image" -o cyclonedx-json="sbom/${slug}.cyclonedx.json"
            syft "$image" -o spdx-json="sbom/${slug}.spdx.json"
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assistant-sboms
          path: sbom/

      - name: grype image vulnerability scan (fail on High and Critical)
        run: |
          images="\
            ${{ env.REGISTRY_HOST }}/${{ env.WEB_IMAGE }}:${{ gitea.sha }} \
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_CODEX_IMAGE }}:${{ gitea.sha }} \
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_CLAUDE_IMAGE }}:${{ gitea.sha }} \
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_GATEWAY_IMAGE }}:${{ gitea.sha }} \
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_MCP_IMAGE }}:${{ gitea.sha }} \
            ${{ env.REGISTRY_HOST }}/${{ env.ASSISTANT_VALIDATOR_IMAGE }}:${{ gitea.sha }}"
          for image in $images; do
            grype "$image" --fail-on high
          done

      - name: Repository, image-layer, and resolved-Compose secret-leak gate
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          ops/assistant/check_secret_leaks.sh

      - name: Assistant live network-denial gate
        run: ops/assistant/test_network_denials.sh
