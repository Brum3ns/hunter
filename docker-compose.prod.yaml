# Production Compose stack. Pulls the images the Gitea Actions workflow builds
# and pushes; it does not build anything locally or depend on a deployment UI.
#
# Deploy-host prerequisites (the workflow only fixes the push side):
#   1. Insecure registry — the registry is HTTP. Add to the host's
#      /etc/docker/daemon.json:  {"insecure-registries": ["10.0.1.2:3002"]}
#      then restart docker, or `pull_policy: always` fails on the HTTPS probe.
#   2. Registry auth — `docker login 10.0.1.2:3002` as gadmin (the PAT), or the
#      pull is denied.
#   3. TLS reverse proxy — production sets force_ssl + assume_ssl. The internal
#      runner works over http://web:5000, but browser login needs HTTPS (session
#      cookies are `secure`). Put a TLS-terminating proxy in front of port 5000.
#
# All values are overridable from a .env file placed next to this compose file.
# Required (no default — set these in .env): HUNTER_SECRET_KEY_BASE,
# HUNTER_ADMIN_PASSWORD (and HUNTER_RAILS_MASTER_KEY if the app reads encrypted
# credentials). An empty HUNTER_ADMIN_PASSWORD makes db:seed abort (blank
# password rejected) and web will crash-loop, same failure mode as a weak
# HUNTER_RUNNER_TOKEN.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HUNTER_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${HUNTER_DB_PASSWORD:-postgres}
    volumes:
      - hunter_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HUNTER_DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node replica set rs0 — required for MongoDB change streams (the
  # sitemap sync). The healthcheck initiates the set on first boot (idempotent)
  # and only reports healthy once a primary is elected.
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "if (!db.hello().isWritablePrimary) { try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } catch (e) {} ; throw new Error('mongo rs0 not ready') }"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 5s

  web:
    image: ${HUNTER_REGISTRY_HOST:-10.0.1.2:3002}/${HUNTER_REGISTRY_OWNER:-gadmin}/${HUNTER_REGISTRY_REPO:-hunter}-web:${HUNTER_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    # db:prepare creates + loads the schema for all four production databases
    # (primary, cache, queue, cable). db:seed is idempotent (admin user + runner
    # from RUNNER_TOKEN). NOTE: RUNNER_TOKEN must be empty or strong — a weak
    # token makes the seed abort and web never starts.
    command: >
      sh -c 'rm -f tmp/pids/server.pid &&
             bundle exec rails db:prepare &&
             bundle exec rails db:seed &&
             foreman start -f Procfile.prod'
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: ${HUNTER_RAILS_SERVE_STATIC_FILES:-true}
      RAILS_LOG_TO_STDOUT: ${HUNTER_RAILS_LOG_TO_STDOUT:-true}
      SECRET_KEY_BASE: ${HUNTER_SECRET_KEY_BASE}
      RAILS_MASTER_KEY: ${HUNTER_RAILS_MASTER_KEY:-}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${HUNTER_ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${HUNTER_ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${HUNTER_ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
      DB_HOST: ${HUNTER_DB_HOST:-db}
      DB_PORT: ${HUNTER_DB_PORT:-5432}
      DB_DATABASE: ${HUNTER_DB_DATABASE:-hunter_production}
      DB_USERNAME: ${HUNTER_DB_USERNAME:-postgres}
      DB_PASSWORD: ${HUNTER_DB_PASSWORD:-postgres}
      MONGO_HOST: ${HUNTER_MONGO_HOST:-mongo}
      MONGO_PORT: ${HUNTER_MONGO_PORT:-27017}
      MONGO_REPLICA_SET: ${HUNTER_MONGO_REPLICA_SET:-rs0}
      MONGO_DATABASE: ${HUNTER_MONGO_DATABASE:-bugbounty}
      MONGO_COLLECTION: ${HUNTER_MONGO_COLLECTION:-vulnerabilities}
      MONGO_PROGRAMS_COLLECTION: ${HUNTER_MONGO_PROGRAMS_COLLECTION:-scope}
      MONGO_ALIVE_COLLECTION: ${HUNTER_MONGO_ALIVE_COLLECTION:-alive}
      MONGO_CRAWL_COLLECTION: ${HUNTER_MONGO_CRAWL_COLLECTION:-crawl}
      MONGO_USERNAME: ${HUNTER_MONGO_USERNAME:-}
      MONGO_PASSWORD: ${HUNTER_MONGO_PASSWORD:-}
      MONGO_AUTH_SOURCE: ${HUNTER_MONGO_AUTH_SOURCE:-admin}
      MONGO_SERVER_SELECTION_TIMEOUT: ${HUNTER_MONGO_SERVER_SELECTION_TIMEOUT:-3}
      MONGO_CONNECT_TIMEOUT: ${HUNTER_MONGO_CONNECT_TIMEOUT:-3}
      ADMIN_USERNAME: ${HUNTER_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${HUNTER_ADMIN_PASSWORD}
      RUNNER_TOKEN: ${HUNTER_RUNNER_TOKEN:-}
      RUNNER_NAME: ${HUNTER_RUNNER_NAME:-default}
      RUNNER_KINDS: ${HUNTER_RUNNER_KINDS:-curl}
      RUNNER_JOB_TTL: ${HUNTER_RUNNER_JOB_TTL:-90}
      WHITERABBIT_BIN: ${HUNTER_WHITERABBIT_BIN:-/usr/local/bin/whiterabbit}
      SCOPE_BIN: ${HUNTER_SCOPE_BIN:-/usr/local/bin/scope}
      CMDSCRIPT_HASH_SALT: ${HUNTER_CMDSCRIPT_HASH_SALT:-}
      RABBITMQ_HOST: ${HUNTER_RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${HUNTER_RABBITMQ_PORT:-5672}
      RABBITMQ_HTTP_PORT: ${HUNTER_RABBITMQ_HTTP_PORT:-15672}
      RABBITMQ_USERNAME: ${HUNTER_RABBITMQ_USERNAME:-hunter}
      RABBITMQ_PASSWORD: ${HUNTER_RABBITMQ_PASSWORD:-hunter}
      RABBITMQ_TOKEN: ${HUNTER_RABBITMQ_TOKEN:-}
      ANSIBLE_LEASE_SECONDS: ${HUNTER_ANSIBLE_LEASE_SECONDS:-45}
      ANSIBLE_CLAIM_TIMEOUT_SECONDS: ${HUNTER_ANSIBLE_CLAIM_TIMEOUT_SECONDS:-300}
      ASSISTANT_ANSIBLE_MODULE_ALLOWLIST: ${HUNTER_ASSISTANT_ANSIBLE_MODULE_ALLOWLIST:-}
      # Assistant provider keys — the sole activation signal. Leaving both
      # blank/placeholder leaves the Assistant cleanly disabled; setting
      # either one enables it.
      ASSISTANT_ANTHROPIC_API_KEY: ${HUNTER_ASSISTANT_ANTHROPIC_API_KEY:-}
      ASSISTANT_OPENAI_API_KEY: ${HUNTER_ASSISTANT_OPENAI_API_KEY:-}
      # Assistant machine credentials, operator-supplied (generate with
      # `openssl rand -base64 32`) — see .env.example.
      ASSISTANT_MCP_HUNTER_TOKEN: ${HUNTER_ASSISTANT_MCP_HUNTER_TOKEN:-}
      ASSISTANT_GATEWAY_INGRESS_TOKEN: ${HUNTER_ASSISTANT_GATEWAY_INGRESS_TOKEN:-}
      ASSISTANT_VALIDATOR_INGRESS_TOKEN: ${HUNTER_ASSISTANT_VALIDATOR_INGRESS_TOKEN:-}
      # Where Rails reaches the gateway/validator over plain HTTP.
      ASSISTANT_GATEWAY_URL: ${HUNTER_ASSISTANT_GATEWAY_URL:-http://assistant-gateway:8081}
      ASSISTANT_VALIDATOR_URL: ${HUNTER_ASSISTANT_VALIDATOR_URL:-http://assistant-validator:8082}
      # Where Rails reaches the Claude Code wrapper, and the bearer it uses.
      ASSISTANT_CLAUDE_URL: ${HUNTER_ASSISTANT_CLAUDE_URL:-http://assistant-claude:8083}
      ASSISTANT_CLAUDE_INGRESS_TOKEN: ${HUNTER_ASSISTANT_CLAUDE_INGRESS_TOKEN:-}
      # Where Rails reaches the Codex wrapper, and its distinct ingress bearer.
      ASSISTANT_CODEX_URL: ${HUNTER_ASSISTANT_CODEX_URL:-http://assistant-codex:8084}
      ASSISTANT_CODEX_INGRESS_TOKEN: ${HUNTER_ASSISTANT_CODEX_INGRESS_TOKEN:-}
      ASSISTANT_TRANSCRIPT_DAYS: ${HUNTER_ASSISTANT_TRANSCRIPT_DAYS:-7}
      ASSISTANT_AUDIT_DAYS: ${HUNTER_ASSISTANT_AUDIT_DAYS:-90}
      ASSISTANT_GRANT_TTL_SECONDS: ${HUNTER_ASSISTANT_GRANT_TTL_SECONDS:-1800}
      ASSISTANT_MAX_RECORDS: ${HUNTER_ASSISTANT_MAX_RECORDS:-10}
      ASSISTANT_MAX_TOOL_CALLS: ${HUNTER_ASSISTANT_MAX_TOOL_CALLS:-64}
      ASSISTANT_MAX_RESULT_BYTES: ${HUNTER_ASSISTANT_MAX_RESULT_BYTES:-1048576}
      ASSISTANT_MAX_TOTAL_BYTES: ${HUNTER_ASSISTANT_MAX_TOTAL_BYTES:-16777216}
      ASSISTANT_MAX_EFFECTS_PER_TURN: ${HUNTER_ASSISTANT_MAX_EFFECTS_PER_TURN:-32}
      ASSISTANT_MAX_EFFECTS_PER_HOUR: ${HUNTER_ASSISTANT_MAX_EFFECTS_PER_HOUR:-120}
      ASSISTANT_MAX_LAUNCHES_PER_TURN: ${HUNTER_ASSISTANT_MAX_LAUNCHES_PER_TURN:-16}
      ASSISTANT_MAX_LAUNCHES_PER_HOUR: ${HUNTER_ASSISTANT_MAX_LAUNCHES_PER_HOUR:-60}
      ASSISTANT_TURN_STARTS_PER_MINUTE: ${HUNTER_ASSISTANT_TURN_STARTS_PER_MINUTE:-10}
      ASSISTANT_TURN_STARTS_PER_HOUR: ${HUNTER_ASSISTANT_TURN_STARTS_PER_HOUR:-60}
      ASSISTANT_MAX_CONCURRENT_TURNS: ${HUNTER_ASSISTANT_MAX_CONCURRENT_TURNS:-2}
      ASSISTANT_MAX_VALIDATIONS_PER_TURN: ${HUNTER_ASSISTANT_MAX_VALIDATIONS_PER_TURN:-1}
      ASSISTANT_MAX_CREATES_PER_MINUTE: ${HUNTER_ASSISTANT_MAX_CREATES_PER_MINUTE:-5}
      ASSISTANT_MAX_CREATES_PER_HOUR: ${HUNTER_ASSISTANT_MAX_CREATES_PER_HOUR:-30}
    networks:
      - default
      - assistant-rails-gateway
      - assistant-rails-validator
      - assistant-mcp-rails
      - assistant-rails-claude
      - assistant-rails-codex
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/up"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 90s

  # Whiterabbit's broker, for Control Center — NOT the Assistant.
  # The Assistant used to share this service as its turn transport; it now talks
  # to the gateway over HTTP and needs no broker at all. What remains here exists
  # solely because the whiterabbit CLI that `web` shells out to uses RabbitMQ, so
  # the stock image replaces the old custom build: no assistant vhost, no
  # per-service AMQP users, no provisioning one-shot, no secrets mount.
  # The default user is an administrator because whiterabbit's -info calls the
  # management API.
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${HUNTER_RABBITMQ_USERNAME:-hunter}
      RABBITMQ_DEFAULT_PASS: ${HUNTER_RABBITMQ_PASSWORD:-hunter}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  runner:
    image: ${HUNTER_REGISTRY_HOST:-10.0.1.2:3002}/${HUNTER_REGISTRY_OWNER:-gadmin}/${HUNTER_REGISTRY_REPO:-hunter}-runner:${HUNTER_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      HUNTER_API_URL: ${HUNTER_API_URL:-http://web:5000}
      RUNNER_TOKEN: ${HUNTER_RUNNER_TOKEN}
      RUNNER_POLL_INTERVAL: ${HUNTER_RUNNER_POLL_INTERVAL:-2}
      RUNNER_MAX_CONCURRENCY: ${HUNTER_RUNNER_MAX_CONCURRENCY:-30}
      CURL_MAX_TIME: ${HUNTER_CURL_MAX_TIME:-30}
      CURL_MAX_OUTPUT: ${HUNTER_CURL_MAX_OUTPUT:-262144}
    depends_on:
      web:
        condition: service_started
    user: "65534:65534"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256

  ansible-executor:
    image: ${HUNTER_REGISTRY_HOST:-10.0.1.2:3002}/${HUNTER_REGISTRY_OWNER:-gadmin}/${HUNTER_REGISTRY_REPO:-hunter}-ansible-executor:${HUNTER_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      HUNTER_URL: ${HUNTER_ANSIBLE_URL:-http://web:5000}
      HUNTER_RUNNER_TOKEN: ${HUNTER_ANSIBLE_RUNNER_TOKEN}
      ANSIBLE_ALLOWED_CIDRS: ${HUNTER_ANSIBLE_ALLOWED_CIDRS}
      ANSIBLE_ALLOWED_PORTS: ${HUNTER_ANSIBLE_ALLOWED_PORTS:-22}
      ANSIBLE_POLL_SECONDS: ${HUNTER_ANSIBLE_POLL_SECONDS:-2}
      ANSIBLE_HEARTBEAT_SECONDS: ${HUNTER_ANSIBLE_HEARTBEAT_SECONDS:-15}
      ANSIBLE_LEASE_SECONDS: ${HUNTER_ANSIBLE_LEASE_SECONDS:-45}
      ANSIBLE_MAX_EVENT_BATCH: ${HUNTER_ANSIBLE_MAX_EVENT_BATCH:-100}
      ANSIBLE_MAX_BUFFER_BYTES: ${HUNTER_ANSIBLE_MAX_BUFFER_BYTES:-5242880}
      ANSIBLE_CANCEL_GRACE_SECONDS: ${HUNTER_ANSIBLE_CANCEL_GRACE_SECONDS:-10}
      ANSIBLE_MAX_FORKS: ${HUNTER_ANSIBLE_MAX_FORKS:-5}
      ANSIBLE_WORKSPACE_ROOT: /runner
    depends_on:
      web:
        condition: service_started
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /runner:rw,noexec,nosuid,nodev,mode=0700,size=64m
    mem_limit: 512m
    pids_limit: 256
    init: true
    restart: unless-stopped

  # MCP tool broker: the only thing the gateway is allowed to call into Hunter
  # through. Depends only on `web` (its HTTP backend) — no broker, no secrets
  # volume, no bootstrap one-shot.
  hunter-mcp:
    image: ${HUNTER_REGISTRY_HOST:-10.0.1.2:3002}/${HUNTER_REGISTRY_OWNER:-gadmin}/${HUNTER_REGISTRY_REPO:-hunter}-assistant-mcp:${HUNTER_ASSISTANT_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      ASSISTANT_HUNTER_URL: http://web:5000
      ASSISTANT_HUNTER_ALLOWED_HOSTS: web:5000
      ASSISTANT_MCP_ALLOWED_HOSTS: hunter-mcp:8080
      ASSISTANT_MCP_ALLOWED_ORIGINS: http://assistant-gateway:8081,http://hunter-mcp:8080
      ASSISTANT_GATEWAY_MCP_TOKEN: ${HUNTER_ASSISTANT_GATEWAY_MCP_TOKEN}
      ASSISTANT_MCP_HUNTER_TOKEN: ${HUNTER_ASSISTANT_MCP_HUNTER_TOKEN}
    networks:
      - assistant-gateway-mcp
      - assistant-mcp-rails
      - assistant-claude-mcp
      - assistant-codex-mcp
    depends_on:
      web:
        condition: service_started
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/assistant/seccomp/mcp.json
    init: true
    mem_limit: 128m
    cpus: "0.50"
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/hunter-mcp", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Validates a drafted change before it can be applied. Reachable from `web`
  # only, over its own internal network — no other service can reach it.
  assistant-validator:
    profiles: ["legacy-gateway"]
    image: ${HUNTER_REGISTRY_HOST:-10.0.1.2:3002}/${HUNTER_REGISTRY_OWNER:-gadmin}/${HUNTER_REGISTRY_REPO:-hunter}-assistant-validator:${HUNTER_ASSISTANT_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      ASSISTANT_VALIDATOR_INGRESS_TOKEN: ${HUNTER_ASSISTANT_VALIDATOR_INGRESS_TOKEN}
      ASSISTANT_VALIDATOR_ALLOWED_HOSTS: assistant-validator:8082
      ASSISTANT_VALIDATOR_ALLOWED_ORIGINS: http://web:5000
      ASSISTANT_MAX_CONCURRENT_VALIDATIONS: "2"
    networks:
      - assistant-rails-validator
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=1000,gid=1000
      - /work:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/assistant/seccomp/validator.json
    init: true
    mem_limit: 256m
    cpus: "1.00"
    pids_limit: 96
    healthcheck:
      test: ["CMD", "/hunter-assistant-validator", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Runs LLM turns. Reachable from `web` only (assistant-rails-gateway); talks
  # to hunter-mcp over its own internal network; reaches the provider APIs
  # (api.anthropic.com / api.openai.com) over the one non-internal network it
  # carries. Depends on nothing — a keyless gateway just answers
  # gateway_not_ready until a provider key is installed.
  assistant-gateway:
    profiles: ["legacy-gateway"]
    image: ${HUNTER_REGISTRY_HOST:-10.0.1.2:3002}/${HUNTER_REGISTRY_OWNER:-gadmin}/${HUNTER_REGISTRY_REPO:-hunter}-assistant-gateway:${HUNTER_ASSISTANT_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      ASSISTANT_GATEWAY_MCP_TOKEN: ${HUNTER_ASSISTANT_GATEWAY_MCP_TOKEN}
      ASSISTANT_GATEWAY_INGRESS_TOKEN: ${HUNTER_ASSISTANT_GATEWAY_INGRESS_TOKEN}
      ASSISTANT_ANTHROPIC_API_KEY: ${HUNTER_ASSISTANT_ANTHROPIC_API_KEY:-}
      ASSISTANT_OPENAI_API_KEY: ${HUNTER_ASSISTANT_OPENAI_API_KEY:-}
      ASSISTANT_GATEWAY_ALLOWED_HOSTS: assistant-gateway:8081
      ASSISTANT_GATEWAY_ALLOWED_ORIGINS: http://web:5000
      ASSISTANT_MAX_CONCURRENT_TURNS: ${HUNTER_ASSISTANT_MAX_CONCURRENT_TURNS:-2}
    networks:
      - assistant-rails-gateway
      - assistant-gateway-mcp
      - assistant-gateway-egress
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/assistant/seccomp/gateway.json
    init: true
    mem_limit: 256m
    cpus: "1.00"
    pids_limit: 96
    healthcheck:
      test: ["CMD", "/hunter-assistant-gateway", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Runs the official Claude Code CLI on the operator's subscription behind a
  # thin Go HTTP wrapper. Reachable from `web` only (assistant-rails-claude);
  # reaches api.anthropic.com over the one non-internal network it carries.
  # The subscription login/session lives on the assistant_claude_home named
  # volume — the one writable path besides /tmp, since root is read-only.
  assistant-claude:
    image: ${HUNTER_REGISTRY_HOST:-10.0.1.2:3002}/${HUNTER_REGISTRY_OWNER:-gadmin}/${HUNTER_REGISTRY_REPO:-hunter}-assistant-claude:${HUNTER_ASSISTANT_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      ASSISTANT_CLAUDE_INGRESS_TOKEN: ${HUNTER_ASSISTANT_CLAUDE_INGRESS_TOKEN}
      ASSISTANT_CLAUDE_ALLOWED_HOSTS: assistant-claude:8083
      # Where assistant-claude reaches hunter-mcp, and the shared bearer the MCP
      # validates (the same secret hunter-mcp itself is configured with above).
      ASSISTANT_CLAUDE_MCP_URL: http://hunter-mcp:8080/mcp
      ASSISTANT_CLAUDE_MCP_TOKEN: ${HUNTER_ASSISTANT_GATEWAY_MCP_TOKEN}
    networks:
      - assistant-rails-claude
      - assistant-claude-egress
      - assistant-claude-mcp
    volumes:
      - assistant_claude_home:/home/claude
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/assistant/seccomp/claude.json
    init: true
    mem_limit: 512m
    cpus: "1.00"
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/hunter-assistant-claude", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Runs the pinned official Codex CLI on the operator's ChatGPT subscription.
  # Its ingress, MCP route, provider egress and login home are all distinct from
  # assistant-claude; no host port, source bind or provider API key is present.
  assistant-codex:
    image: ${HUNTER_REGISTRY_HOST:-10.0.1.2:3002}/${HUNTER_REGISTRY_OWNER:-gadmin}/${HUNTER_REGISTRY_REPO:-hunter}-assistant-codex:${HUNTER_ASSISTANT_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      ASSISTANT_CODEX_INGRESS_TOKEN: ${HUNTER_ASSISTANT_CODEX_INGRESS_TOKEN:-}
      ASSISTANT_CODEX_ALLOWED_HOSTS: assistant-codex:8084
      ASSISTANT_CODEX_MCP_URL: http://hunter-mcp:8080/mcp
      ASSISTANT_CODEX_MCP_TOKEN: ${HUNTER_ASSISTANT_GATEWAY_MCP_TOKEN}
    networks:
      - assistant-rails-codex
      - assistant-codex-egress
      - assistant-codex-mcp
    volumes:
      - assistant_codex_home:/home/codex/.codex
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/assistant/seccomp/codex.json
    init: true
    mem_limit: 512m
    cpus: "1.00"
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/hunter-assistant-codex", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  rabbitmq_data: {}
  hunter_db:
  mongodb_data:
  assistant_claude_home: {}
  assistant_codex_home: {}

networks:
  assistant-rails-gateway:
    internal: true
  assistant-rails-validator:
    internal: true
  assistant-gateway-mcp:
    internal: true
  assistant-mcp-rails:
    internal: true
  assistant-rails-claude:
    internal: true
  # assistant-claude's route to hunter-mcp (reviewed reads + validated authoring).
  assistant-claude-mcp:
    internal: true
  # assistant-codex's isolated Rails ingress and Hunter MCP route.
  assistant-rails-codex:
