# Production Compose stack. Pulls the images the Gitea Actions workflow builds
# and pushes; it does not build anything locally or depend on a deployment UI.
#
# Deploy-host prerequisites (the workflow only fixes the push side):
#   1. Insecure registry — the registry is HTTP. Add to the host's
#      /etc/docker/daemon.json:  {"insecure-registries": ["10.0.1.2:3002"]}
#      then restart docker, or `pull_policy: always` fails on the HTTPS probe.
#   2. Registry auth — `docker login 10.0.1.2:3002` as gadmin (the PAT), or the
#      pull is denied.
#   3. TLS reverse proxy — production sets force_ssl + assume_ssl. The internal
#      runner works over http://web:5000, but browser login needs HTTPS (session
#      cookies are `secure`). Put a TLS-terminating proxy in front of port 5000.
#
# All values are overridable from a .env file placed next to this compose file.
# Required (no default — set these in .env): SECRET_KEY_BASE, ADMIN_PASSWORD
# (and RAILS_MASTER_KEY if the app reads encrypted credentials). An empty
# ADMIN_PASSWORD makes db:seed abort (blank password rejected) and web will
# crash-loop, same failure mode as a weak RUNNER_TOKEN.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - hunter_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node replica set rs0 — required for MongoDB change streams (the
  # sitemap sync). The healthcheck initiates the set on first boot (idempotent)
  # and only reports healthy once a primary is elected.
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "if (!db.hello().isWritablePrimary) { try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } catch (e) {} ; throw new Error('mongo rs0 not ready') }"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 5s

  web:
    image: ${REGISTRY_HOST:-10.0.1.2:3002}/${REGISTRY_OWNER:-gadmin}/${REGISTRY_REPO:-hunter}-web:${HUNTER_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    # db:prepare creates + loads the schema for all four production databases
    # (primary, cache, queue, cable). db:seed is idempotent (admin user + runner
    # from RUNNER_TOKEN). NOTE: RUNNER_TOKEN must be empty or strong — a weak
    # token makes the seed abort and web never starts.
    command: >
      sh -c 'rm -f tmp/pids/server.pid &&
             bundle exec rails db:prepare &&
             bundle exec rails db:seed &&
             foreman start -f Procfile.prod'
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: ${RAILS_SERVE_STATIC_FILES:-true}
      RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:-true}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-hunter_production}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_REPLICA_SET: ${MONGO_REPLICA_SET:-rs0}
      MONGO_DATABASE: ${MONGO_DATABASE:-bugbounty}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-vulnerabilities}
      MONGO_PROGRAMS_COLLECTION: ${MONGO_PROGRAMS_COLLECTION:-scope}
      MONGO_ALIVE_COLLECTION: ${MONGO_ALIVE_COLLECTION:-alive}
      MONGO_CRAWL_COLLECTION: ${MONGO_CRAWL_COLLECTION:-crawl}
      MONGO_USERNAME: ${MONGO_USERNAME:-}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
      MONGO_SERVER_SELECTION_TIMEOUT: ${MONGO_SERVER_SELECTION_TIMEOUT:-3}
      MONGO_CONNECT_TIMEOUT: ${MONGO_CONNECT_TIMEOUT:-3}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      WHITERABBIT_BIN: ${WHITERABBIT_BIN:-/usr/local/bin/whiterabbit}
      SCOPE_BIN: ${SCOPE_BIN:-/usr/local/bin/scope}
      CMDSCRIPT_HASH_SALT: ${CMDSCRIPT_HASH_SALT:-}
      CONTROL_CENTER_COMMAND_ALLOWLIST: ${CONTROL_CENTER_COMMAND_ALLOWLIST:-}
      ANSIBLE_LEASE_SECONDS: ${ANSIBLE_LEASE_SECONDS:-45}
      ANSIBLE_CLAIM_TIMEOUT_SECONDS: ${ANSIBLE_CLAIM_TIMEOUT_SECONDS:-300}
      ASSISTANT_ANSIBLE_MODULE_ALLOWLIST: ${ASSISTANT_ANSIBLE_MODULE_ALLOWLIST:-}
      # Assistant provider keys — the sole activation signal. Leaving both
      # blank/placeholder leaves the Assistant cleanly disabled; setting
      # either one enables it.
      ASSISTANT_ANTHROPIC_API_KEY: ${ASSISTANT_ANTHROPIC_API_KEY:-}
      ASSISTANT_OPENAI_API_KEY: ${ASSISTANT_OPENAI_API_KEY:-}
      # Assistant machine credentials, operator-supplied (generate with
      # `openssl rand -base64 32`) — see .env.example.
      ASSISTANT_MCP_HUNTER_TOKEN: ${ASSISTANT_MCP_HUNTER_TOKEN:-}
      ASSISTANT_GATEWAY_INGRESS_TOKEN: ${ASSISTANT_GATEWAY_INGRESS_TOKEN:-}
      ASSISTANT_VALIDATOR_INGRESS_TOKEN: ${ASSISTANT_VALIDATOR_INGRESS_TOKEN:-}
      # Where Rails reaches the gateway/validator over plain HTTP.
      ASSISTANT_GATEWAY_URL: ${ASSISTANT_GATEWAY_URL:-http://assistant-gateway:8081}
      ASSISTANT_VALIDATOR_URL: ${ASSISTANT_VALIDATOR_URL:-http://assistant-validator:8082}
      ASSISTANT_TRANSCRIPT_DAYS: "7"
      ASSISTANT_AUDIT_DAYS: "90"
      ASSISTANT_GRANT_TTL_SECONDS: "300"
      ASSISTANT_MAX_RECORDS: "10"
      ASSISTANT_MAX_TOOL_CALLS: "8"
      ASSISTANT_MAX_RESULT_BYTES: "65536"
      ASSISTANT_MAX_TOTAL_BYTES: "262144"
      ASSISTANT_TURN_STARTS_PER_MINUTE: "10"
      ASSISTANT_TURN_STARTS_PER_HOUR: "60"
      ASSISTANT_MAX_CONCURRENT_TURNS: "2"
      ASSISTANT_MAX_VALIDATIONS_PER_TURN: "1"
    networks:
      - default
      - assistant-rails-gateway
      - assistant-rails-validator
      - assistant-mcp-rails
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/up"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 90s

  runner:
    image: ${REGISTRY_HOST:-10.0.1.2:3002}/${REGISTRY_OWNER:-gadmin}/${REGISTRY_REPO:-hunter}-runner:${HUNTER_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      HUNTER_API_URL: ${HUNTER_API_URL:-http://web:5000}
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      RUNNER_POLL_INTERVAL: ${RUNNER_POLL_INTERVAL:-2}
      RUNNER_MAX_CONCURRENCY: ${RUNNER_MAX_CONCURRENCY:-30}
      CURL_MAX_TIME: ${CURL_MAX_TIME:-30}
      CURL_MAX_OUTPUT: ${CURL_MAX_OUTPUT:-262144}
    depends_on:
      web:
        condition: service_started
    user: "65534:65534"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256

  ansible-executor:
    image: ${REGISTRY_HOST:-10.0.1.2:3002}/${REGISTRY_OWNER:-gadmin}/${REGISTRY_REPO:-hunter}-ansible-executor:${HUNTER_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      HUNTER_URL: ${HUNTER_ANSIBLE_URL:-http://web:5000}
      HUNTER_RUNNER_TOKEN: ${HUNTER_ANSIBLE_RUNNER_TOKEN}
      ANSIBLE_ALLOWED_CIDRS: ${ANSIBLE_ALLOWED_CIDRS}
      ANSIBLE_ALLOWED_PORTS: ${ANSIBLE_ALLOWED_PORTS:-22}
      ANSIBLE_POLL_SECONDS: ${ANSIBLE_POLL_SECONDS:-2}
      ANSIBLE_HEARTBEAT_SECONDS: ${ANSIBLE_HEARTBEAT_SECONDS:-15}
      ANSIBLE_LEASE_SECONDS: ${ANSIBLE_LEASE_SECONDS:-45}
      ANSIBLE_MAX_EVENT_BATCH: ${ANSIBLE_MAX_EVENT_BATCH:-100}
      ANSIBLE_MAX_BUFFER_BYTES: ${ANSIBLE_MAX_BUFFER_BYTES:-5242880}
      ANSIBLE_CANCEL_GRACE_SECONDS: ${ANSIBLE_CANCEL_GRACE_SECONDS:-10}
      ANSIBLE_MAX_FORKS: ${ANSIBLE_MAX_FORKS:-5}
      ANSIBLE_WORKSPACE_ROOT: /runner
    depends_on:
      web:
        condition: service_started
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /runner:rw,noexec,nosuid,nodev,mode=0700,size=64m
    mem_limit: 512m
    pids_limit: 256
    init: true
    restart: unless-stopped

  # MCP tool broker: the only thing the gateway is allowed to call into Hunter
  # through. Depends only on `web` (its HTTP backend) — no broker, no secrets
  # volume, no bootstrap one-shot.
  hunter-mcp:
    image: ${REGISTRY_HOST:-10.0.1.2:3002}/${REGISTRY_OWNER:-gadmin}/${REGISTRY_REPO:-hunter}-assistant-mcp:${ASSISTANT_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      ASSISTANT_HUNTER_URL: http://web:5000
      ASSISTANT_HUNTER_ALLOWED_HOSTS: web:5000
      ASSISTANT_MCP_ALLOWED_HOSTS: hunter-mcp:8080
      ASSISTANT_MCP_ALLOWED_ORIGINS: http://assistant-gateway:8081
      ASSISTANT_GATEWAY_MCP_TOKEN: ${ASSISTANT_GATEWAY_MCP_TOKEN}
      ASSISTANT_MCP_HUNTER_TOKEN: ${ASSISTANT_MCP_HUNTER_TOKEN}
    networks:
      - assistant-gateway-mcp
      - assistant-mcp-rails
    depends_on:
      web:
        condition: service_started
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/assistant/seccomp/mcp.json
    init: true
    mem_limit: 128m
    cpus: "0.50"
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/hunter-mcp", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Validates a drafted change before it can be applied. Reachable from `web`
  # only, over its own internal network — no other service can reach it.
  assistant-validator:
    image: ${REGISTRY_HOST:-10.0.1.2:3002}/${REGISTRY_OWNER:-gadmin}/${REGISTRY_REPO:-hunter}-assistant-validator:${ASSISTANT_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      ASSISTANT_VALIDATOR_INGRESS_TOKEN: ${ASSISTANT_VALIDATOR_INGRESS_TOKEN}
      ASSISTANT_VALIDATOR_ALLOWED_HOSTS: assistant-validator:8082
      ASSISTANT_VALIDATOR_ALLOWED_ORIGINS: http://web:5000
      ASSISTANT_MAX_CONCURRENT_VALIDATIONS: "2"
    networks:
      - assistant-rails-validator
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=1000,gid=1000
      - /work:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/assistant/seccomp/validator.json
    init: true
    mem_limit: 256m
    cpus: "1.00"
    pids_limit: 96
    healthcheck:
      test: ["CMD", "/hunter-assistant-validator", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Runs LLM turns. Reachable from `web` only (assistant-rails-gateway); talks
  # to hunter-mcp over its own internal network; reaches the provider APIs
  # (api.anthropic.com / api.openai.com) over the one non-internal network it
  # carries. Depends on nothing — a keyless gateway just answers
  # gateway_not_ready until a provider key is installed.
  assistant-gateway:
    image: ${REGISTRY_HOST:-10.0.1.2:3002}/${REGISTRY_OWNER:-gadmin}/${REGISTRY_REPO:-hunter}-assistant-gateway:${ASSISTANT_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      ASSISTANT_GATEWAY_MCP_TOKEN: ${ASSISTANT_GATEWAY_MCP_TOKEN}
      ASSISTANT_GATEWAY_INGRESS_TOKEN: ${ASSISTANT_GATEWAY_INGRESS_TOKEN}
      ASSISTANT_ANTHROPIC_API_KEY: ${ASSISTANT_ANTHROPIC_API_KEY:-}
      ASSISTANT_OPENAI_API_KEY: ${ASSISTANT_OPENAI_API_KEY:-}
      ASSISTANT_GATEWAY_ALLOWED_HOSTS: assistant-gateway:8081
      ASSISTANT_GATEWAY_ALLOWED_ORIGINS: http://web:5000
      ASSISTANT_MAX_CONCURRENT_TURNS: "2"
    networks:
      - assistant-rails-gateway
      - assistant-gateway-mcp
      - assistant-gateway-egress
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/assistant/seccomp/gateway.json
    init: true
    mem_limit: 256m
    cpus: "1.00"
    pids_limit: 96
    healthcheck:
      test: ["CMD", "/hunter-assistant-gateway", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  hunter_db:
  mongodb_data:

networks:
  assistant-rails-gateway:
    internal: true
  assistant-rails-validator:
    internal: true
  assistant-gateway-mcp:
    internal: true
  assistant-mcp-rails:
    internal: true
  # The gateway's one non-internal network — outbound only, for
  # api.anthropic.com / api.openai.com. No other service joins it.
  assistant-gateway-egress: {}
